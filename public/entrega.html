<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6b5b4f">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    #pedidos {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .pedido {
      background: #1a1a1a;
      border-left: 4px solid #60a5fa;
      border-radius: 8px;
      padding: 20px;
      width: 500px;
    }

    .pedido-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }

    .cliente {
      font-size: 22px;
      font-weight: 700;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn-entregado {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .btn-entregado:hover {
      background: #16a34a;
    }

    .btn-entregado:active {
      transform: scale(0.97);
    }

    .productos {
      list-style: none;
    }

    .productos li {
      font-size: 24px;
      font-weight: 600;
      padding: 8px 0;
      border-bottom: 1px solid #222;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .productos li:last-child {
      border-bottom: none;
    }

    .precio {
      font-size: 16px;
      color: #888;
      font-weight: 400;
    }

    .nota {
      display: block;
      font-size: 17px;
      color: #fbbf24;
      font-weight: 700;
      margin-top: 4px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }

    .total-label {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .total-amount {
      font-size: 24px;
      font-weight: 700;
      color: #60a5fa;
    }

    @media (max-width: 768px) {
      .pedido {
        width: 100%;
      }

      .pedido-header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      .btn-entregado {
        width: 100%;
        padding: 16px;
        font-size: 18px;
        text-align: center;
      }

      .productos li {
        font-size: 20px;
        flex-direction: column;
      }

      .nota {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <h1>Entrega</h1>
  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");

    // Cargar pedidos existentes al abrir la página
    fetch("/pedidos")
      .then(res => res.json())
      .then(pedidos => {
        pedidos.filter(p => p.estado === "pendiente").forEach(mostrarPedido);
      });

    socket.on("nuevoPedido", (pedido) => {
      mostrarPedido(pedido);
    });

    socket.on("pedidoEliminado", (id) => {
      const pedidoDiv = document.getElementById("pedido-" + id);
      if (pedidoDiv) {
        pedidoDiv.remove();
      }
    });

    function mostrarPedido(pedido) {
      const div = document.createElement("div");
      div.id = "pedido-" + pedido.id;
      div.className = "pedido";

      div.innerHTML = `
        <div class="pedido-header">
          <div class="cliente">${pedido.cliente}</div>
          <button class="btn-entregado" onclick="entregar(${pedido.id})">Entregado</button>
        </div>

        <ul class="productos">
          ${pedido.productos.map(p =>
            `<li>
              <div>
                ${p.nombre}
                ${p.nota ? `<span class="nota">${p.nota}</span>` : ""}
              </div>
              <span class="precio">$${p.precio}</span>
            </li>`
          ).join("")}
        </ul>

        <div class="total-row">
          <span class="total-label">Total</span>
          <span class="total-amount">$${pedido.total}</span>
        </div>
      `;

      contenedor.appendChild(div);
    }

    window.entregar = function(id) {
      fetch("/pedido/entregado/" + id, { method: "POST" });
    };
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
