<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega</title>
  <link rel="manifest" href="/manifest-entrega.json">
  <link rel="apple-touch-icon" href="/icon-entrega.svg">
  <meta name="theme-color" content="#111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Entrega">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }

    .header-entrega {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
    }

    .btn-entregados {
      position: absolute;
      right: 0;
      background: #1a1a1a;
      color: #888;
      border: 1.5px solid #333;
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-entregados:hover {
      border-color: #22c55e;
      color: #22c55e;
    }

    .btn-entregados.activo {
      background: #22c55e;
      color: #111;
      border-color: #22c55e;
      font-weight: 700;
    }

    .filtros-hora {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 15px;
    }

    .filtros-hora button {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 16px;
      border: 1.5px solid #333;
      background: #1a1a1a;
      color: #888;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .filtros-hora button:hover {
      border-color: #22c55e;
      color: #22c55e;
    }

    .filtros-hora button.activo {
      background: #22c55e;
      color: #111;
      border-color: #22c55e;
      font-weight: 700;
    }

    .pedido-entregado {
      opacity: 0.7;
      border-left-color: #22c55e !important;
    }

    .pedido-entregado .cliente {
      color: #22c55e;
    }

    .entrega-info {
      color: #555;
      font-size: 12px;
      margin-top: 6px;
    }

    #pedidos {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pedido {
      background: #1a1a1a;
      border-left: 4px solid #60a5fa;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .pedido-contenido {
      flex: 1;
      min-width: 0;
    }

    .pedido-top {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 4px;
    }

    .cliente {
      font-size: 18px;
      font-weight: 700;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .total-amount {
      font-size: 18px;
      font-weight: 700;
      color: #fbbf24;
    }

    .productos {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .productos li {
      font-size: 15px;
      font-weight: 500;
      text-transform: uppercase;
      color: #ccc;
    }

    .punto {
      color: #60a5fa;
      margin-right: 4px;
    }

    .precio {
      font-size: 13px;
      color: #666;
      font-weight: 400;
      margin-left: 4px;
    }

    .qty {
      color: #ef4444;
      font-weight: 800;
    }

    .nota {
      font-size: 12px;
      color: #fbbf24;
      font-weight: 600;
      margin-left: 4px;
    }

    .nota-general {
      font-size: 14px;
      color: #fbbf24;
      font-weight: 600;
      margin-top: 4px;
      padding: 4px 8px;
      background: #2a2200;
      border-radius: 4px;
      border-left: 3px solid #fbbf24;
    }

    .btn-entregado {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-entregado:hover {
      background: #16a34a;
    }

    .btn-entregado:active {
      transform: scale(0.97);
    }

    .btn-listo {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-listo:hover {
      background: #16a34a;
    }

    .btn-listo:disabled {
      background: #555;
      cursor: default;
    }

    .btn-entregado-online {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-entregado-online:hover {
      background: #2563eb;
    }

    .btns-pedido {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .pedido-meta {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      font-size: 13px;
      color: #666;
    }

    .pedido-meta .hora-envio {
      color: #60a5fa;
    }

    .pedido-meta .tiempo {
      color: #f87171;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .pedido {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .btn-entregado, .btn-listo, .btn-entregado-online {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        text-align: center;
      }

      .productos li {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="header-entrega">
    <h1>Entrega</h1>
    <button class="btn-entregados" onclick="toggleEntregados()">Entregados</button>
  </div>
  <div id="entregados-lista" style="display:none;"></div>
  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");
    const pedidosMostrados = new Set();

    // Sonido de notificación con AudioContext (beep real)
    let audioCtx;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playNotification() {
      try {
        const ctx = getAudioCtx();
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.frequency.value = 880;
        osc1.type = "sine";
        gain1.gain.setValueAtTime(0.6, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.15);
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.frequency.value = 1200;
        osc2.type = "sine";
        gain2.gain.setValueAtTime(0.6, ctx.currentTime + 0.18);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc2.start(ctx.currentTime + 0.18);
        osc2.stop(ctx.currentTime + 0.35);
      } catch(e) {}
    }

    // Desbloquear audio en primer toque/clic (requerido en tablets/móviles)
    ["click", "touchstart"].forEach(evt => {
      document.addEventListener(evt, function unlock() {
        getAudioCtx();
        document.removeEventListener(evt, unlock);
      });
    });

    // Tiempo transcurrido
    function tiempoTranscurrido(horaEnvio) {
      if (!horaEnvio) return "";
      const ahora = new Date();
      const partes = horaEnvio.match(/(\d+):(\d+)/);
      if (!partes) return "";
      let h = parseInt(partes[1]);
      const m = parseInt(partes[2]);
      const esPM = /p\.?\s*m\.?/i.test(horaEnvio);
      const esAM = /a\.?\s*m\.?/i.test(horaEnvio);
      if (esPM && h < 12) h += 12;
      if (esAM && h === 12) h = 0;
      const envio = new Date();
      envio.setHours(h, m, 0, 0);
      const diff = Math.floor((ahora - envio) / 60000);
      if (diff < 1) return "ahora";
      if (diff < 60) return "hace " + diff + " min";
      return "hace " + Math.floor(diff / 60) + "h " + (diff % 60) + "m";
    }

    function actualizarTiempos() {
      document.querySelectorAll(".tiempo").forEach(el => {
        const hora = el.dataset.hora;
        if (hora) el.innerText = tiempoTranscurrido(hora);
      });
    }

    setInterval(actualizarTiempos, 60000);

    function cargarPedidos() {
      contenedor.innerHTML = "";
      pedidosMostrados.clear();
      fetch("/pedidos")
        .then(res => res.json())
        .then(pedidos => {
          pedidos.filter(p => p.estado === "pendiente" || p.estado === "Listo").forEach(mostrarPedido);
        });
    }

    // Cargar al inicio
    cargarPedidos();

    // Recargar al reconectar (celular que entra/sale de reposo)
    socket.on("connect", () => {
      if (pedidosMostrados.size > 0) {
        cargarPedidos();
      }
    });

    socket.on("nuevoPedido", (pedido) => {
      if (!pedidosMostrados.has(pedido.id)) {
        playNotification();
        mostrarPedido(pedido);
      }
    });

    socket.on("actualizarPedido", (pedido) => {
      if (pedido.estado !== "pendiente" && pedido.estado !== "Listo") {
        const el = document.getElementById("pedido-" + pedido.id);
        if (el) el.remove();
        pedidosMostrados.delete(pedido.id);
      }
    });

    socket.on("pedidoEliminado", (id) => {
      const el = document.getElementById("pedido-" + id);
      if (el) el.remove();
      pedidosMostrados.delete(id);
    });

    socket.on("pedidoListo", (pedido) => {
      const btnListo = document.querySelector("#pedido-" + pedido.id + " .btn-listo");
      if (btnListo) {
        btnListo.disabled = true;
        btnListo.innerText = "Listo";
        btnListo.style.opacity = "0.5";
      }
    });

    function mostrarPedido(pedido) {
      if (pedidosMostrados.has(pedido.id)) return;
      pedidosMostrados.add(pedido.id);

      const esOnline = pedido.origen === "cliente";
      const esListo = pedido.estado === "Listo";
      const hora = pedido.horaEnvio || new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });

      const div = document.createElement("div");
      div.id = "pedido-" + pedido.id;
      div.className = "pedido";

      let botonesHTML;
      if (esOnline) {
        botonesHTML = `
          <div class="btns-pedido">
            <button class="btn-listo" onclick="marcarListo(${pedido.id})" ${esListo ? 'disabled style="opacity:0.5"' : ""}>
              ${esListo ? "Listo" : "Listo (WA)"}
            </button>
            <button class="btn-entregado-online" onclick="entregar(${pedido.id})">Entregado</button>
          </div>
        `;
      } else {
        botonesHTML = `<button class="btn-entregado" onclick="entregar(${pedido.id})">Entregado</button>`;
      }

      div.innerHTML = `
        <div class="pedido-contenido">
          <div class="pedido-top">
            <span class="cliente">${pedido.cliente}</span>
            <span class="total-amount">$${pedido.total}</span>
          </div>
          <ul class="productos">
            ${pedido.productos.map(p =>
              `<li>
                <span class="punto">&#8226;</span> ${p.cantidad && p.cantidad > 1 ? `<span class="qty">${p.cantidad}</span> ` : ""}${p.nombre}<span class="precio">$${p.precio}</span>${p.nota ? `<span class="nota">${p.nota}</span>` : ""}
              </li>`
            ).join("")}
          </ul>
          ${pedido.nota ? `<div class="nota-general">${pedido.nota}</div>` : ""}
          <div class="pedido-meta">
            <span class="hora-envio">${hora}</span>
            <span class="tiempo" data-hora="${hora}">${tiempoTranscurrido(hora)}</span>
          </div>
        </div>
        ${botonesHTML}
      `;

      contenedor.appendChild(div);
    }

    window.entregar = function(id) {
      const el = document.getElementById("pedido-" + id);
      const btns = el ? el.querySelectorAll("button") : [];
      btns.forEach(b => { b.disabled = true; b.style.opacity = "0.5"; });
      fetch("/pedido/entregado/" + id, { method: "POST" })
        .then(res => {
          if (res.ok) {
            if (el) el.remove();
            pedidosMostrados.delete(id);
          } else {
            btns.forEach(b => { b.disabled = false; b.style.opacity = "1"; });
          }
        })
        .catch(() => {
          btns.forEach(b => { b.disabled = false; b.style.opacity = "1"; });
        });
    };

    window.marcarListo = function(id) {
      const btn = document.querySelector("#pedido-" + id + " .btn-listo");
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = "0.5";
        btn.innerText = "...";
      }

      fetch("/pedido/listo/" + id, { method: "POST" })
        .then(res => res.json())
        .then(pedido => {
          if (btn) btn.innerText = "Listo";

          // Extraer teléfono y nombre del campo cliente: "Nombre (Tel: 5512345678)"
          const match = pedido.cliente.match(/^(.+?)\s*\(Tel:\s*(\d+)\)/);
          if (match) {
            const nombre = match[1].trim();
            const telefono = match[2];
            const mensaje = encodeURIComponent("Hola " + nombre + ", su pedido en La Cabaña está listo. Puede pasar a recogerlo.");
            window.open("https://wa.me/52" + telefono + "?text=" + mensaje, "_blank");
          }
        })
        .catch(() => {
          if (btn) { btn.disabled = false; btn.style.opacity = "1"; btn.innerText = "Listo (WA)"; }
        });
    };

    let mostrandoEntregados = false;
    let todosEntregados = [];
    let filtroHoraActual = "todos";

    const lapsos = [
      { label: "Todos", key: "todos" },
      { label: "7-9am", desde: 7, hasta: 9 },
      { label: "9-11am", desde: 9, hasta: 11 },
      { label: "11am-1pm", desde: 11, hasta: 13 },
      { label: "1-3pm", desde: 13, hasta: 15 },
      { label: "3-5pm", desde: 15, hasta: 17 },
      { label: "5-7pm", desde: 17, hasta: 19 },
      { label: "7-9pm", desde: 19, hasta: 21 },
      { label: "9-11pm", desde: 21, hasta: 23 }
    ];

    function fechaHoyMX() {
      return new Date().toLocaleDateString("es-MX", { timeZone: "America/Mexico_City", year: "numeric", month: "2-digit", day: "2-digit" });
    }

    function fechaAyerMX() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toLocaleDateString("es-MX", { timeZone: "America/Mexico_City", year: "numeric", month: "2-digit", day: "2-digit" });
    }

    function parsearHora(horaStr) {
      if (!horaStr) return -1;
      const partes = horaStr.match(/(\d+):(\d+)/);
      if (!partes) return -1;
      let h = parseInt(partes[1]);
      const esPM = /p\.?\s*m\.?/i.test(horaStr);
      const esAM = /a\.?\s*m\.?/i.test(horaStr);
      if (esPM && h < 12) h += 12;
      if (esAM && h === 12) h = 0;
      return h;
    }

    function toggleEntregados() {
      const lista = document.getElementById("entregados-lista");
      const btn = document.querySelector(".btn-entregados");
      mostrandoEntregados = !mostrandoEntregados;

      if (mostrandoEntregados) {
        btn.classList.add("activo");
        lista.style.display = "block";
        lista.style.marginBottom = "20px";

        fetch("/pedidos")
          .then(res => res.json())
          .then(pedidos => {
            const hoy = fechaHoyMX();
            todosEntregados = pedidos.filter(p =>
              p.estado === "Entregado" && p.fecha === hoy
            ).sort((a, b) => {
              const ha = a.horaEntrega || "00:00";
              const hb = b.horaEntrega || "00:00";
              return hb.localeCompare(ha);
            });
            filtroHoraActual = "todos";
            renderEntregados();
          });
      } else {
        btn.classList.remove("activo");
        lista.style.display = "none";
        lista.innerHTML = "";
      }
    }

    function renderEntregados() {
      const lista = document.getElementById("entregados-lista");
      lista.innerHTML = "";

      // Filtros de hora
      const filtrosDiv = document.createElement("div");
      filtrosDiv.className = "filtros-hora";
      lapsos.forEach(l => {
        const btn = document.createElement("button");
        btn.innerText = l.label;
        const key = l.key || l.label;
        if (key === filtroHoraActual) btn.classList.add("activo");
        btn.onclick = () => {
          filtroHoraActual = key;
          renderEntregados();
        };
        filtrosDiv.appendChild(btn);
      });
      lista.appendChild(filtrosDiv);

      // Filtrar
      let filtrados = todosEntregados;
      if (filtroHoraActual !== "todos") {
        const lapso = lapsos.find(l => l.label === filtroHoraActual);
        if (lapso) {
          filtrados = todosEntregados.filter(p => {
            const h = parsearHora(p.horaEntrega);
            return h >= lapso.desde && h < lapso.hasta;
          });
        }
      }

      if (filtrados.length === 0) {
        const msg = document.createElement("div");
        msg.style.cssText = "text-align:center;color:#555;font-size:14px;margin-top:10px;";
        msg.innerText = "No hay pedidos en este horario";
        lista.appendChild(msg);
        return;
      }

      const contPedidos = document.createElement("div");
      contPedidos.style.cssText = "display:flex;flex-direction:column;gap:10px;";

      filtrados.forEach(p => {
        const div = document.createElement("div");
        div.className = "pedido pedido-entregado";
        div.innerHTML = `
          <div class="pedido-contenido">
            <div class="pedido-top">
              <span class="cliente">${p.cliente}</span>
              <span class="total-amount">$${p.total}</span>
            </div>
            <ul class="productos">
              ${p.productos.map(pr =>
                `<li>
                  <span class="punto">&#8226;</span> ${pr.cantidad && pr.cantidad > 1 ? `<span class="qty">${pr.cantidad}</span> ` : ""}${pr.nombre}<span class="precio">$${pr.precio}</span>${pr.nota ? `<span class="nota">${pr.nota}</span>` : ""}
                </li>`
              ).join("")}
            </ul>
            ${p.nota ? `<div class="nota-general">${p.nota}</div>` : ""}
            <div class="entrega-info">${p.fecha || ""} ${p.horaEntrega || ""}</div>
          </div>
        `;
        contPedidos.appendChild(div);
      });

      lista.appendChild(contPedidos);
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
