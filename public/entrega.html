<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega</title>
  <link rel="manifest" href="/manifest-entrega.json">
  <link rel="apple-touch-icon" href="/icon-entrega.png">
  <meta name="theme-color" content="#111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Entrega">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }

    .header-entrega {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
    }

    .btn-entregados {
      position: absolute;
      right: 0;
      background: #1a1a1a;
      color: #888;
      border: 1.5px solid #333;
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-entregados:hover {
      border-color: #22c55e;
      color: #22c55e;
    }

    .btn-entregados.activo {
      background: #22c55e;
      color: #111;
      border-color: #22c55e;
      font-weight: 700;
    }

    .filtros-hora {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 15px;
    }

    .filtros-hora button {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 16px;
      border: 1.5px solid #333;
      background: #1a1a1a;
      color: #888;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .filtros-hora button:hover {
      border-color: #22c55e;
      color: #22c55e;
    }

    .filtros-hora button.activo {
      background: #22c55e;
      color: #111;
      border-color: #22c55e;
      font-weight: 700;
    }

    .pedido-entregado {
      opacity: 0.7;
      border-left-color: #22c55e !important;
    }

    .pedido-entregado .cliente {
      color: #22c55e;
    }

    .entrega-info {
      color: #555;
      font-size: 12px;
      margin-top: 6px;
    }

    #pedidos {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pedido {
      background: #1a1a1a;
      border-left: 4px solid #60a5fa;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
    }

    .pedido-contenido {
      flex: 1;
      min-width: 0;
    }

    .pedido-top {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 4px;
    }

    .cliente {
      font-size: 18px;
      font-weight: 700;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .total-amount {
      font-size: 18px;
      font-weight: 700;
      color: #fbbf24;
    }

    .productos {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .productos li {
      font-size: 15px;
      font-weight: 500;
      text-transform: uppercase;
      color: #ccc;
    }

    .punto {
      color: #60a5fa;
      margin-right: 4px;
    }

    .precio {
      font-size: 13px;
      color: #666;
      font-weight: 400;
      margin-left: 4px;
    }

    .qty {
      color: #ef4444;
      font-weight: 800;
    }

    .nota {
      font-size: 12px;
      color: #fbbf24;
      font-weight: 600;
      margin-left: 4px;
    }

    .productos li {
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .productos li:active {
      transform: scale(0.97);
    }

    .productos li.entregado {
      text-decoration: line-through;
      opacity: 0.35;
    }

    .nota-general {
      font-size: 14px;
      color: #fbbf24;
      font-weight: 600;
      margin-top: 4px;
      padding: 4px 8px;
      background: #2a2200;
      border-radius: 4px;
      border-left: 3px solid #fbbf24;
    }

    .para-llevar {
      font-size: 12px;
      color: #f97316;
      font-weight: 700;
      text-transform: uppercase;
    }

    .btn-entregado {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-entregado:hover {
      background: #16a34a;
    }

    .btn-entregado:active {
      transform: scale(0.97);
    }

    .btn-listo {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-listo:hover {
      background: #16a34a;
    }

    .btn-listo:disabled {
      background: #555;
      cursor: default;
    }

    .btn-entregado-online {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-entregado-online:hover {
      background: #2563eb;
    }

    .btn-regresar {
      background: #f59e0b;
      color: #111;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-regresar:hover {
      background: #d97706;
    }

    .btns-pedido {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .pedido-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 12px;
      color: #666;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .pedido-meta .hora-envio {
      color: #60a5fa;
    }

    .pedido-meta .tiempo {
      color: #f87171;
      font-weight: 600;
    }

    /* ===== CELULAR (solo phones, no iPad) ===== */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 16px;
        letter-spacing: 3px;
      }

      .header-entrega {
        margin-bottom: 12px;
        padding-bottom: 10px;
      }

      .btn-entregados {
        padding: 6px 10px;
        font-size: 11px;
      }

      .pedido {
        padding: 8px 10px;
        gap: 10px;
      }

      .cliente {
        font-size: 14px;
      }

      .total-amount {
        font-size: 14px;
      }

      .pedido-top {
        gap: 8px;
        margin-bottom: 2px;
      }

      .productos li {
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .precio {
        display: none;
      }

      .nota {
        font-size: 10px;
      }

      .nota-general {
        font-size: 11px;
        padding: 3px 6px;
        margin-top: 2px;
      }

      .pedido-meta {
        font-size: 10px;
      }

      .btn-entregado, .btn-listo, .btn-entregado-online, .btn-regresar {
        padding: 10px 12px;
        font-size: 12px;
        letter-spacing: 0;
      }

      .btns-pedido {
        gap: 4px;
      }

      .para-llevar {
        font-size: 10px;
      }

      .filtros-hora button {
        padding: 4px 8px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

<div id="loadingOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#faf8f5;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 0.5s ease;">
  <style>#loadingSpinner{width:36px;height:36px;border:3px solid #e8e4df;border-top:3px solid #c0785a;border-radius:50%;animation:lcSpin 0.8s linear infinite;margin-top:18px;}@keyframes lcSpin{to{transform:rotate(360deg)}}</style>
  <div style="font-size:24px;font-weight:300;letter-spacing:4px;text-transform:uppercase;color:#6b5b4f;font-family:'Segoe UI',Arial,sans-serif;">La Cabaña</div>
  <div style="font-size:14px;color:#c0785a;margin-top:10px;font-family:'Segoe UI',Arial,sans-serif;">Cargando sistema...</div>
  <div id="loadingSpinner"></div>
</div>

  <div class="header-entrega">
    <h1>Entrega</h1>
    <button class="btn-entregados" onclick="toggleEntregados()">Entregados</button>
  </div>
  <div id="entregados-lista" style="display:none;"></div>
  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");
    const pedidosMostrados = new Set();

    // Sonido de notificación con AudioContext (beep real)
    let audioCtx;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playNotification() {
      try {
        const ctx = getAudioCtx();
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.frequency.value = 880;
        osc1.type = "sine";
        gain1.gain.setValueAtTime(0.6, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.15);
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.frequency.value = 1200;
        osc2.type = "sine";
        gain2.gain.setValueAtTime(0.6, ctx.currentTime + 0.18);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc2.start(ctx.currentTime + 0.18);
        osc2.stop(ctx.currentTime + 0.35);
      } catch(e) {}
    }

    // Desbloquear audio en primer toque/clic (requerido en tablets/móviles)
    ["click", "touchstart"].forEach(evt => {
      document.addEventListener(evt, function unlock() {
        getAudioCtx();
        document.removeEventListener(evt, unlock);
      });
    });

    // Calcular minutos transcurridos
    function calcularMinutos(horaEnvio) {
      if (!horaEnvio) return 0;
      const ahora = new Date();
      const partes = horaEnvio.match(/(\d+):(\d+)/);
      if (!partes) return 0;
      let h = parseInt(partes[1]);
      const m = parseInt(partes[2]);
      const esPM = /p\.?\s*m\.?/i.test(horaEnvio);
      const esAM = /a\.?\s*m\.?/i.test(horaEnvio);
      if (esPM && h < 12) h += 12;
      if (esAM && h === 12) h = 0;
      const envio = new Date();
      envio.setHours(h, m, 0, 0);
      return Math.floor((ahora - envio) / 60000);
    }

    function tiempoTranscurrido(horaEnvio) {
      const diff = calcularMinutos(horaEnvio);
      if (diff < 1) return "ahora";
      if (diff < 60) return "hace " + diff + " min";
      return "hace " + Math.floor(diff / 60) + "h " + (diff % 60) + "m";
    }

    function actualizarTiempos() {
      document.querySelectorAll(".tiempo").forEach(el => {
        const hora = el.dataset.hora;
        if (hora) el.innerText = tiempoTranscurrido(hora);
      });
    }

    setInterval(actualizarTiempos, 60000);

    function cargarPedidos() {
      contenedor.innerHTML = "";
      pedidosMostrados.clear();
      fetch("/pedidos")
        .then(res => res.json())
        .then(pedidos => {
          pedidos.filter(p => p.estado === "pendiente" || p.estado === "Listo").forEach(mostrarPedido);
        });
    }

    // Ocultar overlay de carga
    function ocultarLoadingOverlay(){var o=document.getElementById("loadingOverlay");if(o){o.style.opacity="0";setTimeout(function(){o.remove();},500);}}

    // Cargar al inicio
    cargarPedidos();
    ocultarLoadingOverlay();

    // Recargar al reconectar (celular que entra/sale de reposo)
    socket.on("connect", () => {
      if (pedidosMostrados.size > 0) {
        cargarPedidos();
      }
    });

    socket.on("nuevoPedido", (pedido) => {
      if (!pedidosMostrados.has(pedido.id)) {
        playNotification();
        mostrarPedido(pedido);
      }
    });

    socket.on("actualizarPedido", (pedido) => {
      if (pedido.estado !== "pendiente" && pedido.estado !== "Listo") {
        const el = document.getElementById("pedido-" + pedido.id);
        if (el) el.remove();
        pedidosMostrados.delete(pedido.id);
      }
    });

    socket.on("pedidoEliminado", (id) => {
      const el = document.getElementById("pedido-" + id);
      if (el) el.remove();
      pedidosMostrados.delete(id);
    });

    socket.on("pedidoListo", (pedido) => {
      const btnListo = document.querySelector("#pedido-" + pedido.id + " .btn-listo");
      if (btnListo) {
        btnListo.disabled = true;
        btnListo.innerText = "Listo";
        btnListo.style.opacity = "0.5";
      }
    });

    function mostrarPedido(pedido) {
      if (pedidosMostrados.has(pedido.id)) return;
      pedidosMostrados.add(pedido.id);

      const esOnline = pedido.origen === "cliente";
      const esListo = pedido.estado === "Listo";
      const hora = pedido.horaEnvio || new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });

      const div = document.createElement("div");
      div.id = "pedido-" + pedido.id;
      div.className = "pedido";

      let botonesHTML;
      if (esOnline) {
        botonesHTML = `
          <div class="btns-pedido">
            <button class="btn-listo" onclick="marcarListo(${pedido.id})" ${esListo ? 'disabled style="opacity:0.5"' : ""}>
              ${esListo ? "Listo" : "Listo (WA)"}
            </button>
            <button class="btn-entregado-online" onclick="entregar(${pedido.id})">Entregado</button>
          </div>
        `;
      } else {
        botonesHTML = `<button class="btn-entregado" onclick="entregar(${pedido.id})">Entregado</button>`;
      }

      div.innerHTML = `
        <div class="pedido-contenido">
          <div class="pedido-top">
            <span class="cliente">${pedido.cliente}</span>
            <span class="total-amount">$${pedido.total}</span>
          </div>
          <ul class="productos">
            ${pedido.productos.map((p, i) =>
              `<li data-index="${i}" data-pedido-id="${pedido.id}" onclick="entregarProducto(${pedido.id}, ${i}, this)" ${(pedido.productosEntregados || []).includes(i) ? 'class="entregado"' : ""}>
                <span class="punto">&#8226;</span> ${p.cantidad && p.cantidad > 1 ? `<span class="qty">${p.cantidad}</span> ` : ""}${p.nombre}<span class="precio">$${p.precio}</span>${p.nota ? `<span class="nota">${p.nota}</span>` : ""}
              </li>`
            ).join("")}
          </ul>
          ${pedido.nota ? `<div class="nota-general">${pedido.nota}</div>` : ""}
        </div>
        ${pedido.paraLlevar ? `<div class="para-llevar">Para llevar</div>` : ""}
        <div class="pedido-meta">
          <span class="hora-envio">${hora}</span>
          <span class="tiempo" data-hora="${hora}">${tiempoTranscurrido(hora)}</span>
        </div>
        ${botonesHTML}
      `;

      // Insertar ordenado: más antiguo arriba (más minutos = más arriba)
      const minutos = calcularMinutos(hora);
      let insertado = false;
      for (const hijo of contenedor.children) {
        const tiempoHijo = hijo.querySelector(".tiempo");
        if (tiempoHijo) {
          const minHijo = calcularMinutos(tiempoHijo.dataset.hora);
          if (minutos > minHijo) {
            contenedor.insertBefore(div, hijo);
            insertado = true;
            break;
          }
        }
      }
      if (!insertado) contenedor.appendChild(div);
    }

    window.entregar = function(id) {
      const el = document.getElementById("pedido-" + id);
      const btns = el ? el.querySelectorAll("button") : [];
      btns.forEach(b => { b.disabled = true; b.style.opacity = "0.5"; });
      fetch("/pedido/entregado/" + id, { method: "POST" })
        .then(res => {
          if (res.ok) {
            if (el) el.remove();
            pedidosMostrados.delete(id);
          } else {
            btns.forEach(b => { b.disabled = false; b.style.opacity = "1"; });
          }
        })
        .catch(() => {
          btns.forEach(b => { b.disabled = false; b.style.opacity = "1"; });
        });
    };

    window.marcarListo = function(id) {
      const btn = document.querySelector("#pedido-" + id + " .btn-listo");
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = "0.5";
        btn.innerText = "...";
      }

      // Abrir ventana inmediatamente (en el click) para evitar bloqueo de popups
      const waWindow = window.open("", "_blank");

      fetch("/pedido/listo/" + id, { method: "POST" })
        .then(res => res.json())
        .then(pedido => {
          if (btn) btn.innerText = "Listo";

          // Extraer teléfono y nombre del campo cliente: "Nombre (Tel: 5512345678)"
          const match = pedido.cliente.match(/^(.+?)\s*\(Tel:\s*(\d+)\)/);
          if (match) {
            const nombre = match[1].trim();
            const telefono = match[2];
            const mensaje = encodeURIComponent("Hola " + nombre + ", su pedido en La Cabaña está listo. Puede pasar a recogerlo.");
            waWindow.location.href = "https://wa.me/52" + telefono + "?text=" + mensaje;
          } else if (waWindow) {
            waWindow.close();
          }
        })
        .catch(() => {
          if (btn) { btn.disabled = false; btn.style.opacity = "1"; btn.innerText = "Listo (WA)"; }
        });
    };

    window.entregarProducto = function(pedidoId, index, li) {
      if (li.classList.contains("entregado")) {
        // Regresar producto a cocina
        li.classList.remove("entregado");
        fetch("/pedido/" + pedidoId + "/producto/" + index + "/regresar", { method: "POST" });
        return;
      }
      li.classList.add("entregado");
      fetch("/pedido/" + pedidoId + "/producto/" + index, { method: "POST" });
    };

    socket.on("productoEntregado", ({ pedidoId, index }) => {
      const el = document.getElementById("pedido-" + pedidoId);
      if (!el) return;
      const li = el.querySelector(`li[data-index="${index}"]`);
      if (li) li.classList.add("entregado");

      // Si todos están tachados, eliminar pedido
      const todos = el.querySelectorAll(".productos li");
      const entregados = el.querySelectorAll(".productos li.entregado");
      if (todos.length > 0 && todos.length === entregados.length) {
        el.remove();
        pedidosMostrados.delete(pedidoId);
      }
    });

    socket.on("productoRegresado", ({ pedidoId, index }) => {
      const el = document.getElementById("pedido-" + pedidoId);
      if (!el) return;
      const li = el.querySelector(`li[data-index="${index}"]`);
      if (li) li.classList.remove("entregado");
    });

    socket.on("pedidoRegresado", (pedido) => {
      // Agregar pedido de vuelta a entrega si no está
      if (!pedidosMostrados.has(pedido.id)) {
        mostrarPedido(pedido);
      }
      // Si estamos viendo entregados, refrescar
      if (mostrandoEntregados) {
        todosEntregados = todosEntregados.filter(p => p.id !== pedido.id);
        renderEntregados();
      }
    });

    window.regresarPedido = function(id, btn) {
      btn.disabled = true;
      btn.style.opacity = "0.5";
      fetch("/pedido/" + id + "/regresar", { method: "POST" })
        .then(res => {
          if (res.ok) {
            // Se maneja por socket: pedidoRegresado
          } else {
            btn.disabled = false;
            btn.style.opacity = "1";
          }
        })
        .catch(() => {
          btn.disabled = false;
          btn.style.opacity = "1";
        });
    };

    let mostrandoEntregados = false;
    let todosEntregados = [];

    function fechaHoyMX() {
      return new Date().toLocaleDateString("es-MX", { timeZone: "America/Mexico_City", year: "numeric", month: "2-digit", day: "2-digit" });
    }

    function toggleEntregados() {
      const lista = document.getElementById("entregados-lista");
      const btn = document.querySelector(".btn-entregados");
      mostrandoEntregados = !mostrandoEntregados;

      if (mostrandoEntregados) {
        btn.classList.add("activo");
        lista.style.display = "block";
        lista.style.marginBottom = "20px";

        fetch("/pedidos")
          .then(res => res.json())
          .then(pedidos => {
            const hoy = fechaHoyMX();
            todosEntregados = pedidos.filter(p =>
              p.estado === "Entregado" && p.fecha === hoy
            ).sort((a, b) => b.id - a.id);
            renderEntregados();
          });
      } else {
        btn.classList.remove("activo");
        lista.style.display = "none";
        lista.innerHTML = "";
      }
    }

    function renderEntregados() {
      const lista = document.getElementById("entregados-lista");
      lista.innerHTML = "";

      if (todosEntregados.length === 0) {
        const msg = document.createElement("div");
        msg.style.cssText = "text-align:center;color:#555;font-size:14px;margin-top:10px;";
        msg.innerText = "No hay pedidos entregados hoy";
        lista.appendChild(msg);
        return;
      }

      const contPedidos = document.createElement("div");
      contPedidos.style.cssText = "display:flex;flex-direction:column;gap:10px;";

      todosEntregados.forEach(p => {
        const div = document.createElement("div");
        div.className = "pedido pedido-entregado";
        div.innerHTML = `
          <div class="pedido-contenido">
            <div class="pedido-top">
              <span class="cliente">${p.cliente}</span>
              <span class="total-amount">$${p.total}</span>
            </div>
            <ul class="productos">
              ${p.productos.map(pr =>
                `<li>
                  <span class="punto">&#8226;</span> ${pr.cantidad && pr.cantidad > 1 ? `<span class="qty">${pr.cantidad}</span> ` : ""}${pr.nombre}<span class="precio">$${pr.precio}</span>${pr.nota ? `<span class="nota">${pr.nota}</span>` : ""}
                </li>`
              ).join("")}
            </ul>
            ${p.nota ? `<div class="nota-general">${p.nota}</div>` : ""}
            <div class="entrega-info">${p.fecha || ""} ${p.horaEntrega || ""}</div>
          </div>
          <button class="btn-regresar" onclick="regresarPedido(${p.id}, this)">Regresar</button>
        `;
        contPedidos.appendChild(div);
      });

      lista.appendChild(contPedidos);
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
