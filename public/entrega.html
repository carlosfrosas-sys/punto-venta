<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega</title>
  <link rel="manifest" href="/manifest-entrega.json">
  <link rel="apple-touch-icon" href="/icon-entrega.svg">
  <meta name="theme-color" content="#111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Entrega">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }

    .header-entrega {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    h1 {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
    }

    .btn-entregados {
      position: absolute;
      right: 0;
      background: #1a1a1a;
      color: #888;
      border: 1.5px solid #333;
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn-entregados:hover {
      border-color: #22c55e;
      color: #22c55e;
    }

    .btn-entregados.activo {
      background: #22c55e;
      color: #111;
      border-color: #22c55e;
      font-weight: 700;
    }

    .pedido-entregado {
      opacity: 0.6;
      border-left-color: #22c55e !important;
    }

    .pedido-entregado .cliente {
      color: #22c55e;
    }

    #pedidos {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pedido {
      background: #1a1a1a;
      border-left: 4px solid #60a5fa;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .pedido-contenido {
      flex: 1;
      min-width: 0;
    }

    .pedido-top {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 4px;
    }

    .cliente {
      font-size: 18px;
      font-weight: 700;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .total-amount {
      font-size: 18px;
      font-weight: 700;
      color: #fbbf24;
    }

    .productos {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0 16px;
    }

    .productos li {
      font-size: 15px;
      font-weight: 500;
      text-transform: uppercase;
      color: #ccc;
    }

    .precio {
      font-size: 13px;
      color: #666;
      font-weight: 400;
      margin-left: 4px;
    }

    .qty {
      color: #ef4444;
      font-weight: 800;
    }

    .nota {
      font-size: 12px;
      color: #fbbf24;
      font-weight: 600;
      margin-left: 4px;
    }

    .nota-general {
      font-size: 14px;
      color: #fbbf24;
      font-weight: 600;
      margin-top: 4px;
      padding: 4px 8px;
      background: #2a2200;
      border-radius: 4px;
      border-left: 3px solid #fbbf24;
    }

    .btn-entregado {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-entregado:hover {
      background: #16a34a;
    }

    .btn-entregado:active {
      transform: scale(0.97);
    }

    @media (max-width: 768px) {
      .pedido {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .btn-entregado {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        text-align: center;
      }

      .productos {
        flex-direction: column;
        gap: 2px;
      }

      .productos li {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="header-entrega">
    <h1>Entrega</h1>
    <button class="btn-entregados" onclick="toggleEntregados()">Entregados</button>
  </div>
  <div id="entregados-lista" style="display:none;"></div>
  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");

    // Cargar pedidos existentes al abrir la página
    fetch("/pedidos")
      .then(res => res.json())
      .then(pedidos => {
        pedidos.filter(p => p.estado === "pendiente").forEach(mostrarPedido);
      });

    socket.on("nuevoPedido", (pedido) => {
      mostrarPedido(pedido);
    });

    socket.on("pedidoEliminado", (id) => {
      const pedidoDiv = document.getElementById("pedido-" + id);
      if (pedidoDiv) {
        pedidoDiv.remove();
      }
    });

    function mostrarPedido(pedido) {
      const div = document.createElement("div");
      div.id = "pedido-" + pedido.id;
      div.className = "pedido";

      div.innerHTML = `
        <div class="pedido-contenido">
          <div class="pedido-top">
            <span class="cliente">${pedido.cliente}</span>
            <span class="total-amount">$${pedido.total}</span>
          </div>
          ${pedido.nota ? `<div class="nota-general">${pedido.nota}</div>` : ""}
          <ul class="productos">
            ${pedido.productos.map(p =>
              `<li>
                ${p.cantidad && p.cantidad > 1 ? `<span class="qty">${p.cantidad}</span> ` : ""}${p.nombre}<span class="precio">$${p.precio}</span>${p.nota ? `<span class="nota">${p.nota}</span>` : ""}
              </li>`
            ).join("")}
          </ul>
        </div>
        <button class="btn-entregado" onclick="entregar(${pedido.id})">Entregado</button>
      `;

      contenedor.appendChild(div);
    }

    window.entregar = function(id) {
      fetch("/pedido/entregado/" + id, { method: "POST" });
    };

    let mostrandoEntregados = false;

    function toggleEntregados() {
      const lista = document.getElementById("entregados-lista");
      const btn = document.querySelector(".btn-entregados");
      mostrandoEntregados = !mostrandoEntregados;

      if (mostrandoEntregados) {
        btn.classList.add("activo");
        lista.style.display = "flex";
        lista.style.flexDirection = "column";
        lista.style.gap = "10px";
        lista.style.marginBottom = "20px";
        lista.innerHTML = "";

        fetch("/pedidos")
          .then(res => res.json())
          .then(pedidos => {
            const entregados = pedidos.filter(p => p.estado === "Entregado");
            if (entregados.length === 0) {
              lista.innerHTML = '<div style="text-align:center;color:#555;font-size:14px;">No hay pedidos entregados</div>';
              return;
            }
            entregados.reverse().forEach(p => {
              const div = document.createElement("div");
              div.className = "pedido pedido-entregado";
              div.innerHTML = `
                <div class="pedido-contenido">
                  <div class="pedido-top">
                    <span class="cliente">${p.cliente}</span>
                    <span class="total-amount">$${p.total}</span>
                  </div>
                  ${p.nota ? `<div class="nota-general">${p.nota}</div>` : ""}
                  <ul class="productos">
                    ${p.productos.map(pr =>
                      `<li>
                        ${pr.cantidad && pr.cantidad > 1 ? `<span class="qty">${pr.cantidad}</span> ` : ""}${pr.nombre}<span class="precio">$${pr.precio}</span>${pr.nota ? `<span class="nota">${pr.nota}</span>` : ""}
                      </li>`
                    ).join("")}
                  </ul>
                  ${p.horaEntrega ? `<div style="color:#555;font-size:12px;margin-top:6px;">Entregado: ${p.horaEntrega}</div>` : ""}
                </div>
              `;
              lista.appendChild(div);
            });
          });
      } else {
        btn.classList.remove("activo");
        lista.style.display = "none";
        lista.innerHTML = "";
      }
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
