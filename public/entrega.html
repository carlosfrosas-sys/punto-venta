<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrega</title>
  <link rel="manifest" href="/manifest-entrega.json">
  <link rel="apple-touch-icon" href="/icon-entrega.svg">
  <meta name="theme-color" content="#111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Entrega">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    #pedidos {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pedido {
      background: #1a1a1a;
      border-left: 4px solid #60a5fa;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .pedido-contenido {
      flex: 1;
      min-width: 0;
    }

    .pedido-top {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 4px;
    }

    .cliente {
      font-size: 18px;
      font-weight: 700;
      color: #60a5fa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .total-amount {
      font-size: 18px;
      font-weight: 700;
      color: #fbbf24;
    }

    .productos {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0 16px;
    }

    .productos li {
      font-size: 15px;
      font-weight: 500;
      text-transform: uppercase;
      color: #ccc;
    }

    .precio {
      font-size: 13px;
      color: #666;
      font-weight: 400;
      margin-left: 4px;
    }

    .nota {
      font-size: 12px;
      color: #fbbf24;
      font-weight: 600;
      margin-left: 4px;
    }

    .btn-entregado {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-entregado:hover {
      background: #16a34a;
    }

    .btn-entregado:active {
      transform: scale(0.97);
    }

    @media (max-width: 768px) {
      .pedido {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .btn-entregado {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        text-align: center;
      }

      .productos {
        flex-direction: column;
        gap: 2px;
      }

      .productos li {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <h1>Entrega</h1>
  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");

    // Cargar pedidos existentes al abrir la página
    fetch("/pedidos")
      .then(res => res.json())
      .then(pedidos => {
        pedidos.filter(p => p.estado === "pendiente").forEach(mostrarPedido);
      });

    socket.on("nuevoPedido", (pedido) => {
      mostrarPedido(pedido);
    });

    socket.on("pedidoEliminado", (id) => {
      const pedidoDiv = document.getElementById("pedido-" + id);
      if (pedidoDiv) {
        pedidoDiv.remove();
      }
    });

    function mostrarPedido(pedido) {
      const div = document.createElement("div");
      div.id = "pedido-" + pedido.id;
      div.className = "pedido";

      div.innerHTML = `
        <div class="pedido-contenido">
          <div class="pedido-top">
            <span class="cliente">${pedido.cliente}</span>
            <span class="total-amount">$${pedido.total}</span>
          </div>
          <ul class="productos">
            ${pedido.productos.map(p =>
              `<li>
                ${p.nombre}<span class="precio">$${p.precio}</span>${p.nota ? `<span class="nota">${p.nota}</span>` : ""}
              </li>`
            ).join("")}
          </ul>
        </div>
        <button class="btn-entregado" onclick="entregar(${pedido.id})">Entregado</button>
      `;

      contenedor.appendChild(div);
    }

    window.entregar = function(id) {
      fetch("/pedido/entregado/" + id, { method: "POST" });
    };
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
