<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocina</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    #pedidos {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .pedido {
      background: #1a1a1a;
      border-left: 4px solid #4ade80;
      border-radius: 8px;
      padding: 20px;
      width: 380px;
    }

    .cliente {
      font-size: 22px;
      font-weight: 700;
      color: #4ade80;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }

    .productos {
      list-style: none;
    }

    .productos li {
      font-size: 28px;
      font-weight: 600;
      padding: 8px 0;
      border-bottom: 1px solid #222;
      text-transform: uppercase;
    }

    .productos li:last-child {
      border-bottom: none;
    }

    .nota {
      display: block;
      font-size: 20px;
      color: #f87171;
      font-weight: 700;
      margin-top: 4px;
      padding-left: 10px;
    }

    @media (max-width: 768px) {
      .pedido {
        width: 100%;
      }

      .productos li {
        font-size: 22px;
      }

      .nota {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>

  <h1>Cocina</h1>
  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");

    socket.on("nuevoPedido", (pedido) => {
      mostrarPedido(pedido);
    });

    socket.on("pedidoEliminado", (id) => {
      const pedidoDiv = document.getElementById("pedido-" + id);
      if (pedidoDiv) {
        pedidoDiv.remove();
      }
    });

    function mostrarPedido(pedido) {
      const div = document.createElement("div");
      div.id = "pedido-" + pedido.id;
      div.className = "pedido";

      div.innerHTML = `
        <div class="cliente">${pedido.cliente}</div>
        <ul class="productos">
          ${pedido.productos.map(p =>
            `<li>
              ${p.nombre}
              ${p.nota ? `<span class="nota">${p.nota}</span>` : ""}
            </li>`
          ).join("")}
        </ul>
      `;

      contenedor.appendChild(div);
    }
  </script>

</body>
</html>
