<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocina</title>
  <link rel="manifest" href="/manifest-cocina.json">
  <link rel="apple-touch-icon" href="/icon-cocina.svg">
  <meta name="theme-color" content="#111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cocina">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 15px 20px;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 15px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    #pedidos {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: calc(100vh - 80px);
      overflow-y: auto;
    }

    .pedido {
      background: #1a1a1a;
      border-left: 6px solid #4ade80;
      border-radius: 8px;
      padding: 14px 20px;
      width: 100%;
    }

    .productos {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .productos li {
      font-size: 48px;
      font-weight: 600;
      padding: 2px 0;
      text-transform: uppercase;
    }

    .punto {
      color: #4ade80;
      margin-right: 8px;
    }

    .qty {
      color: #ef4444;
      font-weight: 800;
    }

    .nota {
      display: inline;
      font-size: 28px;
      color: #f87171;
      font-weight: 600;
      margin-left: 8px;
    }

    .nota-general {
      font-size: 30px;
      color: #fbbf24;
      font-weight: 600;
      padding: 6px 12px;
      background: #2a2200;
      border-radius: 6px;
      border-left: 4px solid #fbbf24;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>Cocina</h1>
  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");
    const pedidosMostrados = new Set();

    function cargarPedidos() {
      contenedor.innerHTML = "";
      pedidosMostrados.clear();
      fetch("/pedidos")
        .then(res => res.json())
        .then(pedidos => {
          pedidos.filter(p => p.estado === "pendiente").forEach(mostrarPedido);
        });
    }

    // Cargar al inicio
    cargarPedidos();

    // Recargar al reconectar
    socket.on("connect", () => {
      if (pedidosMostrados.size > 0) {
        cargarPedidos();
      }
    });

    socket.on("nuevoPedido", (pedido) => {
      if (!pedidosMostrados.has(pedido.id)) {
        mostrarPedido(pedido);
      }
    });

    socket.on("actualizarPedido", (pedido) => {
      if (pedido.estado !== "pendiente") {
        const el = document.getElementById("pedido-" + pedido.id);
        if (el) el.remove();
        pedidosMostrados.delete(pedido.id);
      }
    });

    socket.on("pedidoEliminado", (id) => {
      const el = document.getElementById("pedido-" + id);
      if (el) el.remove();
      pedidosMostrados.delete(id);
    });

    function mostrarPedido(pedido) {
      if (pedidosMostrados.has(pedido.id)) return;
      pedidosMostrados.add(pedido.id);

      const div = document.createElement("div");
      div.id = "pedido-" + pedido.id;
      div.className = "pedido";

      div.innerHTML = `
        <ul class="productos">
          ${pedido.productos.map(p =>
            `<li>
              <span class="punto">&#8226;</span> ${p.cantidad && p.cantidad > 1 ? `<span class="qty">${p.cantidad}</span> ` : ""}${p.nombre}
              ${p.nota ? `<span class="nota">${p.nota.replace(/\s*\+\$\d+/g, "")}</span>` : ""}
            </li>`
          ).join("")}
        </ul>
        ${pedido.nota ? `<div class="nota-general">${pedido.nota}</div>` : ""}
      `;

      contenedor.appendChild(div);
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
