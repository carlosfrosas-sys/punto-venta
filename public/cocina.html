<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cocina</title>
  <link rel="manifest" href="/manifest-cocina.json">
  <link rel="apple-touch-icon" href="/icon-cocina.svg">
  <meta name="theme-color" content="#111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cocina">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 15px 20px;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 15px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    #pedidos {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: calc(100vh - 80px);
      overflow-y: auto;
    }

    .pedido {
      background: #1a1a1a;
      border-left: 6px solid #4ade80;
      border-radius: 8px;
      padding: 14px 20px;
      width: 100%;
    }

    .pedido-body {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .productos {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .productos li {
      font-size: 48px;
      font-weight: 600;
      padding: 2px 0;
      text-transform: uppercase;
    }

    .punto {
      color: #4ade80;
      margin-right: 8px;
    }

    .qty {
      color: #ef4444;
      font-weight: 800;
    }

    .nota {
      display: inline;
      font-size: 28px;
      color: #f87171;
      font-weight: 600;
      margin-left: 8px;
    }

    .pedido-lado {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
      margin-left: 20px;
    }

    .nota-general {
      font-size: 28px;
      color: #fbbf24;
      font-weight: 600;
      padding: 6px 12px;
      background: #2a2200;
      border-radius: 6px;
      border-left: 4px solid #fbbf24;
      text-align: right;
    }

    .para-llevar {
      font-size: 20px;
      color: #f97316;
      font-weight: 700;
      text-transform: uppercase;
    }

    .pedido {
      position: relative;
    }

    .pedido-meta {
      position: absolute;
      right: 20px;
      bottom: 10px;
      display: flex;
      gap: 12px;
      font-size: 18px;
      color: #666;
      margin: 0;
    }

    .pedido-meta .hora-envio {
      color: #60a5fa;
    }

    .pedido-meta .tiempo {
      color: #f87171;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <h1>Cocina</h1>
  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");
    const pedidosMostrados = new Set();

    // Sonido de notificación con AudioContext (beep real)
    let audioCtx;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playNotification() {
      try {
        const ctx = getAudioCtx();
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.frequency.value = 880;
        osc1.type = "sine";
        gain1.gain.setValueAtTime(0.6, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.15);
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.frequency.value = 1200;
        osc2.type = "sine";
        gain2.gain.setValueAtTime(0.6, ctx.currentTime + 0.18);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc2.start(ctx.currentTime + 0.18);
        osc2.stop(ctx.currentTime + 0.35);
      } catch(e) {}
    }

    // Desbloquear audio en primer toque/clic (requerido en tablets/móviles)
    ["click", "touchstart"].forEach(evt => {
      document.addEventListener(evt, function unlock() {
        getAudioCtx();
        document.removeEventListener(evt, unlock);
      });
    });

    // Calcular tiempo transcurrido
    function tiempoTranscurrido(horaEnvio) {
      if (!horaEnvio) return "";
      const ahora = new Date();
      const partes = horaEnvio.match(/(\d+):(\d+)/);
      if (!partes) return "";
      let h = parseInt(partes[1]);
      const m = parseInt(partes[2]);
      const esPM = /p\.?\s*m\.?/i.test(horaEnvio);
      const esAM = /a\.?\s*m\.?/i.test(horaEnvio);
      if (esPM && h < 12) h += 12;
      if (esAM && h === 12) h = 0;
      const envio = new Date();
      envio.setHours(h, m, 0, 0);
      const diff = Math.floor((ahora - envio) / 60000);
      if (diff < 1) return "ahora";
      if (diff < 60) return "hace " + diff + " min";
      return "hace " + Math.floor(diff / 60) + "h " + (diff % 60) + "m";
    }

    function actualizarTiempos() {
      document.querySelectorAll(".tiempo").forEach(el => {
        const hora = el.dataset.hora;
        if (hora) el.innerText = tiempoTranscurrido(hora);
      });
    }

    setInterval(actualizarTiempos, 60000);

    function cargarPedidos() {
      contenedor.innerHTML = "";
      pedidosMostrados.clear();
      fetch("/pedidos")
        .then(res => res.json())
        .then(pedidos => {
          pedidos.filter(p => p.estado === "pendiente").forEach(mostrarPedido);
        });
    }

    // Cargar al inicio
    cargarPedidos();

    // Recargar al reconectar
    socket.on("connect", () => {
      if (pedidosMostrados.size > 0) {
        cargarPedidos();
      }
    });

    socket.on("nuevoPedido", (pedido) => {
      if (!pedidosMostrados.has(pedido.id)) {
        playNotification();
        mostrarPedido(pedido);
      }
    });

    socket.on("actualizarPedido", (pedido) => {
      if (pedido.estado !== "pendiente") {
        const el = document.getElementById("pedido-" + pedido.id);
        if (el) el.remove();
        pedidosMostrados.delete(pedido.id);
      }
    });

    socket.on("pedidoEliminado", (id) => {
      const el = document.getElementById("pedido-" + id);
      if (el) el.remove();
      pedidosMostrados.delete(id);
    });

    socket.on("productoEntregado", ({ pedidoId, index }) => {
      const el = document.getElementById("pedido-" + pedidoId);
      if (!el) return;
      const li = el.querySelector(`li[data-index="${index}"]`);
      if (li) li.remove();

      // Si no quedan productos visibles, eliminar pedido
      const restantes = el.querySelectorAll(".productos li");
      if (restantes.length === 0) {
        el.remove();
        pedidosMostrados.delete(pedidoId);
      }
    });

    const bebidasCocina = ["Agua ", "Licuado de ", "Café ", "Capuccino", "Espumoso", "Té", "Yakult", "Panzoncita", "Peñafielita", "Boing", "Del Valle", "Refresco de Sabor", "Fuze Tea", "Lechita", "Jumex", "Coca", "Volt", "Electrolit", "Gatorade", "Monster", "Redbull", "Agua Caliente"];

    function esBebida(nombre) {
      return bebidasCocina.some(b => nombre.startsWith(b));
    }

    function mostrarPedido(pedido) {
      if (pedidosMostrados.has(pedido.id)) return;
      pedidosMostrados.add(pedido.id);

      const entregados = pedido.productosEntregados || [];
      const productosCocina = pedido.productos
        .map((p, i) => ({ ...p, _index: i }))
        .filter(p => !esBebida(p.nombre) && !entregados.includes(p._index));
      if (productosCocina.length === 0) return;

      const hora = pedido.horaEnvio || new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });

      const div = document.createElement("div");
      div.id = "pedido-" + pedido.id;
      div.className = "pedido";

      div.innerHTML = `
        <div class="pedido-body">
          <ul class="productos">
            ${productosCocina.map(p =>
              `<li data-index="${p._index}">
                <span class="punto">&#8226;</span> ${p.cantidad && p.cantidad > 1 ? `<span class="qty">${p.cantidad}</span> ` : ""}${p.nombre}
                ${p.nota ? `<span class="nota">${p.nota.replace(/\s*\+\$\d+/g, "")}</span>` : ""}
              </li>`
            ).join("")}
          </ul>
          ${pedido.nota || pedido.paraLlevar ? `<div class="pedido-lado">
            ${pedido.paraLlevar ? `<div class="para-llevar">Para llevar</div>` : ""}
            ${pedido.nota ? `<div class="nota-general">${pedido.nota}</div>` : ""}
          </div>` : ""}
        <div class="pedido-meta">
          <span class="hora-envio">${hora}</span>
          <span class="tiempo" data-hora="${hora}">${tiempoTranscurrido(hora)}</span>
        </div>
      `;

      contenedor.appendChild(div);
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
