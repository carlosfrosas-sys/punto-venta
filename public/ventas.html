<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    .total-dia {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-left: 4px solid #fbbf24;
    }

    .total-dia .label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #888;
    }

    .total-dia .cantidad {
      font-size: 32px;
      font-weight: 700;
      color: #fbbf24;
    }

    .contador {
      text-align: center;
      color: #555;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    #pedidos {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .pedido {
      background: #1a1a1a;
      border-left: 4px solid #22c55e;
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      max-width: 700px;
    }

    .pedido-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }

    .cliente {
      font-size: 20px;
      font-weight: 700;
      color: #22c55e;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .pedido-total {
      font-size: 18px;
      font-weight: 700;
      color: #fbbf24;
    }

    .hora {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    .productos {
      list-style: none;
    }

    .productos li {
      font-size: 18px;
      font-weight: 500;
      padding: 6px 0;
      border-bottom: 1px solid #222;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .productos li:last-child {
      border-bottom: none;
    }

    .precio {
      font-size: 14px;
      color: #888;
      font-weight: 400;
    }

    .nota {
      display: block;
      font-size: 14px;
      color: #f87171;
      font-weight: 600;
      margin-top: 2px;
    }

    @media (max-width: 768px) {
      .pedido {
        width: 100%;
      }

      .total-dia .cantidad {
        font-size: 26px;
      }

      .productos li {
        font-size: 16px;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <h1>Ventas del Día</h1>

  <div class="total-dia">
    <span class="label">Total del día</span>
    <span class="cantidad">$<span id="totalDia">0</span></span>
  </div>

  <div class="contador" id="contador">0 pedidos entregados</div>

  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");
    let totalDia = 0;
    let cantidadPedidos = 0;

    function actualizarTotal() {
      document.getElementById("totalDia").innerText = totalDia;
      document.getElementById("contador").innerText = cantidadPedidos + " pedido" + (cantidadPedidos !== 1 ? "s" : "") + " entregado" + (cantidadPedidos !== 1 ? "s" : "");
    }

    function mostrarPedido(pedido) {
      const div = document.createElement("div");
      div.className = "pedido";

      div.innerHTML = `
        <div class="pedido-header">
          <div class="cliente">${pedido.cliente}</div>
          <div style="text-align:right;">
            <div class="pedido-total">$${pedido.total}</div>
            ${pedido.horaEntrega ? `<div class="hora">${pedido.horaEntrega}</div>` : ""}
          </div>
        </div>
        <ul class="productos">
          ${pedido.productos.map(p =>
            `<li>
              <div>
                ${p.nombre}
                ${p.nota ? `<span class="nota">${p.nota}</span>` : ""}
              </div>
              <span class="precio">$${p.precio}</span>
            </li>`
          ).join("")}
        </ul>
      `;

      contenedor.prepend(div);
      totalDia += pedido.total;
      cantidadPedidos++;
      actualizarTotal();
    }

    // Cargar pedidos entregados al abrir la página
    fetch("/pedidos")
      .then(res => res.json())
      .then(pedidos => {
        pedidos.filter(p => p.estado === "Entregado").forEach(mostrarPedido);
      });

    // Actualizar en tiempo real cuando se entrega un pedido
    socket.on("pedidoEliminado", (id) => {
      fetch("/pedidos")
        .then(res => res.json())
        .then(pedidos => {
          const pedido = pedidos.find(p => p.id === id && p.estado === "Entregado");
          if (pedido) {
            mostrarPedido(pedido);
          }
        });
    });
  </script>

</body>
</html>
