<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    .fechas {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .fechas button {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 20px;
      border: 1.5px solid #333;
      background: #1a1a1a;
      color: #888;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .fechas button:hover {
      border-color: #fbbf24;
      color: #fbbf24;
    }

    .fechas button.activo {
      background: #fbbf24;
      color: #111;
      border-color: #fbbf24;
      font-weight: 700;
    }

    .total-dia {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-left: 4px solid #fbbf24;
    }

    .total-dia .label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #888;
    }

    .total-dia .cantidad {
      font-size: 32px;
      font-weight: 700;
      color: #fbbf24;
    }

    .contador {
      text-align: center;
      color: #555;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    #pedidos {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .pedido {
      background: #1a1a1a;
      border-left: 4px solid #22c55e;
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      max-width: 700px;
    }

    .pedido-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }

    .cliente {
      font-size: 20px;
      font-weight: 700;
      color: #22c55e;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .pedido-total {
      font-size: 18px;
      font-weight: 700;
      color: #fbbf24;
    }

    .hora {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    .productos {
      list-style: none;
    }

    .productos li {
      font-size: 18px;
      font-weight: 500;
      padding: 6px 0;
      border-bottom: 1px solid #222;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .productos li:last-child {
      border-bottom: none;
    }

    .precio {
      font-size: 14px;
      color: #888;
      font-weight: 400;
    }

    .nota {
      display: block;
      font-size: 14px;
      color: #f87171;
      font-weight: 600;
      margin-top: 2px;
    }

    .sin-datos {
      text-align: center;
      color: #555;
      font-size: 16px;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      .pedido {
        width: 100%;
      }

      .total-dia .cantidad {
        font-size: 26px;
      }

      .productos li {
        font-size: 16px;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <h1>Ventas</h1>

  <div class="fechas" id="fechas"></div>

  <div class="total-dia">
    <span class="label">Total del día</span>
    <span class="cantidad">$<span id="totalDia">0</span></span>
  </div>

  <div class="contador" id="contador">0 pedidos entregados</div>

  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");
    const contFechas = document.getElementById("fechas");
    let fechaActual = "";

    function actualizarTotal(total, cantidad) {
      document.getElementById("totalDia").innerText = total;
      document.getElementById("contador").innerText = cantidad + " pedido" + (cantidad !== 1 ? "s" : "") + " entregado" + (cantidad !== 1 ? "s" : "");
    }

    function mostrarPedido(pedido) {
      const div = document.createElement("div");
      div.className = "pedido";

      div.innerHTML = `
        <div class="pedido-header">
          <div class="cliente">${pedido.cliente}</div>
          <div style="text-align:right;">
            <div class="pedido-total">$${pedido.total}</div>
            ${pedido.horaEntrega ? `<div class="hora">${pedido.horaEntrega}</div>` : ""}
          </div>
        </div>
        <ul class="productos">
          ${pedido.productos.map(p =>
            `<li>
              <div>
                ${p.nombre}
                ${p.nota ? `<span class="nota">${p.nota}</span>` : ""}
              </div>
              <span class="precio">$${p.precio}</span>
            </li>`
          ).join("")}
        </ul>
      `;

      contenedor.prepend(div);
    }

    function cargarFecha(fecha) {
      fechaActual = fecha;
      contenedor.innerHTML = "";

      // Marcar botón activo
      document.querySelectorAll(".fechas button").forEach(btn => {
        btn.classList.toggle("activo", btn.dataset.fecha === fecha);
      });

      fetch("/ventas/fecha/" + encodeURIComponent(fecha))
        .then(res => res.json())
        .then(data => {
          if (data.pedidos.length === 0) {
            contenedor.innerHTML = '<div class="sin-datos">No hay ventas en esta fecha</div>';
          } else {
            data.pedidos.forEach(mostrarPedido);
          }
          actualizarTotal(data.total, data.pedidos.length);
        });
    }

    function cargarFechas() {
      fetch("/ventas/fechas")
        .then(res => res.json())
        .then(fechas => {
          contFechas.innerHTML = "";

          if (fechas.length === 0) {
            // Si no hay fechas con fecha guardada, cargar todos los entregados
            fetch("/pedidos")
              .then(res => res.json())
              .then(pedidos => {
                const entregados = pedidos.filter(p => p.estado === "Entregado");
                entregados.forEach(mostrarPedido);
                const total = entregados.reduce((acc, p) => acc + p.total, 0);
                actualizarTotal(total, entregados.length);
              });
            return;
          }

          fechas.forEach(fecha => {
            const btn = document.createElement("button");
            btn.innerText = fecha;
            btn.dataset.fecha = fecha;
            btn.onclick = () => cargarFecha(fecha);
            contFechas.appendChild(btn);
          });

          // Cargar la fecha más reciente por defecto
          cargarFecha(fechas[fechas.length - 1]);
        });
    }

    cargarFechas();

    // Actualizar en tiempo real cuando se entrega un pedido
    socket.on("pedidoEliminado", () => {
      cargarFechas();
    });
  </script>

</body>
</html>
