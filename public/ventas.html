<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="/manifest-ventas.json">
  <link rel="apple-touch-icon" href="/icon-ventas.png">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ventas">
  <title>Ventas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }

    body {
      background: #fff;
      color: #1a1a1a;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    /* Layout */
    .app-layout {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #f8f8f8;
      border-right: 1px solid #e5e5e5;
      overflow-y: auto;
      padding: 16px;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e5e5e5;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* Header */
    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .content-title {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .content-subtitle {
      font-size: 13px;
      color: #999;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-actions button {
      padding: 8px 16px;
      font-size: 13px;
      border: 1px solid #e5e5e5;
      background: #fff;
      color: #666;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .header-actions button:hover {
      border-color: #3b82f6;
      color: #3b82f6;
    }

    /* Metric cards */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: #f8f8f8;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 700;
    }

    .metric-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .metric-compare {
      font-size: 11px;
      margin-top: 4px;
      font-weight: 600;
    }

    .metric-compare.up { color: #22c55e; }
    .metric-compare.down { color: #ef4444; }
    .metric-compare.neutral { color: #999; }

    .metric-estrella {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric-total .metric-value { color: #1a1a1a; }
    .metric-efectivo .metric-value { color: #22c55e; }
    .metric-tarjeta .metric-value { color: #3b82f6; }
    .metric-pedidos .metric-value { color: #f59e0b; }
    .metric-promedio .metric-value { color: #8b5cf6; }
    .metric-star .metric-value { color: #f59e0b; }

    /* Charts */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .chart-card {
      background: #f8f8f8;
      border-radius: 12px;
      padding: 20px;
    }

    .chart-title {
      font-size: 13px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    /* Horizontal bar chart */
    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .bar-label {
      width: 100px;
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-track {
      flex: 1;
      height: 24px;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
      margin: 0 10px;
    }

    .bar-fill {
      height: 100%;
      background: #3b82f6;
      border-radius: 6px;
      transition: width 0.5s ease;
      min-width: 2px;
    }

    .bar-value {
      font-size: 12px;
      color: #666;
      width: 80px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Vertical bar chart (hours) */
    .hour-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 120px;
      padding-top: 10px;
    }

    .hour-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
    }

    .hour-bar {
      width: 100%;
      background: #f59e0b;
      border-radius: 4px 4px 0 0;
      transition: height 0.5s ease;
      min-height: 2px;
      position: relative;
    }

    .hour-bar-count {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: #999;
      white-space: nowrap;
    }

    .hour-label {
      font-size: 10px;
      color: #999;
      margin-top: 4px;
    }

    /* Pedidos */
    #pedidos {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pedido {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .pedido-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cliente {
      font-size: 14px;
      font-weight: 700;
      color: #1a1a1a;
      text-transform: uppercase;
    }

    .pedido-prods {
      font-size: 12px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pedido-total {
      font-size: 15px;
      font-weight: 700;
      color: #22c55e;
    }

    .pedido-hora {
      font-size: 11px;
      color: #888;
      font-weight: 600;
      white-space: nowrap;
      margin-left: 6px;
    }

    .btn-eliminar {
      background: transparent;
      border: none;
      color: #ccc;
      padding: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .btn-eliminar:hover {
      color: #ef4444;
    }

    .badge-tarjeta {
      color: #3b82f6;
      font-size: 10px;
      font-weight: 600;
      margin-left: 6px;
    }

    .badge-online {
      color: #8b5cf6;
      font-size: 10px;
      font-weight: 600;
      margin-left: 6px;
    }

    /* Filtro por forma de pago */
    .filtro-pago {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .filtro-pago button {
      background: #f8f8f8;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }

    .filtro-pago button:hover {
      background: #f0f0f0;
    }

    .filtro-pago button.activo {
      background: #1a1a1a;
      border-color: #1a1a1a;
      color: #fff;
    }

    .filtro-pago .fp-monto {
      font-weight: 700;
    }

    .filtro-pago .fp-num {
      font-size: 11px;
      opacity: 0.65;
    }

    .sin-datos {
      text-align: center;
      color: #ccc;
      font-size: 15px;
      margin-top: 40px;
    }

    /* Productos tab */
    .tab-productos {
      display: inline-flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tab-productos button {
      padding: 6px 14px;
      font-size: 13px;
      border: 1px solid #e5e5e5;
      background: #fff;
      color: #666;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
    }

    .tab-productos button.activo {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }

    .tabla-productos {
      width: 100%;
      border-collapse: collapse;
    }

    .tabla-productos th {
      text-align: left;
      padding: 8px 10px;
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #eee;
    }

    .tabla-productos td {
      padding: 8px 10px;
      font-size: 14px;
      border-bottom: 1px solid #f5f5f5;
    }

    .tabla-productos .col-rank { color: #ccc; width: 30px; }
    .tabla-productos .col-nombre { text-transform: uppercase; }
    .tabla-productos .col-cant { text-align: center; font-weight: 700; color: #22c55e; }
    .tabla-productos .col-total { text-align: right; color: #1a1a1a; font-weight: 600; }

    /* Tree navigation */
    .tree-node { cursor: pointer; user-select: none; }

    .tree-toggle {
      display: inline-block;
      width: 16px;
      font-size: 10px;
      color: #999;
    }

    .tree-year {
      font-weight: 700;
      font-size: 15px;
      color: #1a1a1a;
      padding: 8px 0;
    }

    .tree-month {
      font-weight: 600;
      font-size: 14px;
      color: #444;
      padding: 6px 0 6px 8px;
    }

    .tree-week {
      font-size: 12px;
      color: #999;
      padding: 4px 0 4px 16px;
      font-weight: 600;
    }

    .tree-day {
      font-size: 13px;
      color: #666;
      padding: 4px 8px 4px 28px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tree-day:hover { background: #eee; }

    .tree-day.activo {
      background: #3b82f6;
      color: #fff;
    }

    .tree-children { overflow: hidden; }
    .tree-children.collapsed { display: none; }

    /* Quick nav */
    .quick-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e5e5e5;
    }

    .quick-nav button {
      text-align: left;
      padding: 8px 10px;
      font-size: 13px;
      border: none;
      background: transparent;
      color: #666;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.15s;
    }

    .quick-nav button:hover { background: #eee; }

    .quick-nav button.activo {
      background: #3b82f6;
      color: #fff;
    }

    /* Hamburger */
    .hamburger {
      display: none;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      background: #f8f8f8;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      color: #666;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 99;
    }

    @media print {
      body { overflow: visible; height: auto; }
      .sidebar, .hamburger, .sidebar-overlay, .content-header, .btn-eliminar, #headerActions { display: none !important; }
      .app-layout { display: block; }
      .main-content { padding: 0; overflow: visible; }
      #corteImprimir { break-inside: avoid; }
      #selectorCorte { display: none !important; }
      button { display: none !important; }
    }

    @media (max-width: 768px) {
      .hamburger { display: flex; }
      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        height: 100vh;
        width: 260px;
        z-index: 100;
        transition: left 0.3s ease;
      }
      .sidebar.open { left: 0; }
      .sidebar-overlay.open { display: block; }
      .main-content { padding: 60px 16px 16px; }
      .metrics { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .charts-row { grid-template-columns: 1fr; }
      .metric-value { font-size: 22px; }
      .content-header { flex-direction: column; gap: 10px; align-items: flex-start; }
    }
  </style>
</head>

<div id="loginOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="text-align:center;width:280px;">
    <h2 style="font-size:20px;font-weight:300;letter-spacing:4px;text-transform:uppercase;color:#1a1a1a;margin-bottom:24px;">Iniciar Sesion</h2>
    <input type="text" id="loginUsuario" placeholder="Usuario" style="width:100%;padding:12px;font-size:16px;border:1.5px solid #e5e5e5;border-radius:8px;margin-bottom:10px;outline:none;font-family:inherit;background:#f8f8f8;color:#1a1a1a;">
    <input type="password" id="loginPassword" placeholder="Contrasena" style="width:100%;padding:12px;font-size:16px;border:1.5px solid #e5e5e5;border-radius:8px;margin-bottom:10px;outline:none;font-family:inherit;background:#f8f8f8;color:#1a1a1a;" onkeydown="if(event.key==='Enter')hacerLogin()">
    <div id="loginError" style="color:#ef4444;font-size:14px;margin-bottom:10px;display:none;"></div>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;color:#888;cursor:pointer;justify-content:center;">
      <input type="checkbox" id="loginRecordar" checked style="width:18px;height:18px;cursor:pointer;"> Recordarme
    </label>
    <button onclick="hacerLogin()" style="width:100%;padding:12px;font-size:16px;font-weight:600;background:#22c55e;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">Entrar</button>
  </div>
</div>

<script>
// Adjunta el token de la sesión a toda petición al servidor.
// Si el servidor la rechaza, vuelve a pedir la contraseña.
(function() {
  const fetchOriginal = window.fetch;
  window.fetch = function(recurso, opciones) {
    const url = typeof recurso === "string" ? recurso : (recurso && recurso.url) || "";
    const esPropia = url.startsWith("/") || url.startsWith(window.location.origin);
    const token = localStorage.getItem("token_admin");

    if (esPropia && token) {
      opciones = Object.assign({}, opciones);
      if (opciones.headers instanceof Headers) {
        const h = new Headers(opciones.headers);
        h.set("X-Token", token);
        opciones.headers = h;
      } else {
        opciones.headers = Object.assign({}, opciones.headers, { "X-Token": token });
      }
    }

    return fetchOriginal(recurso, opciones).then(res => {
      if (res.status === 401 && esPropia && url.indexOf("/login") === -1) {
        const overlay = document.getElementById("loginOverlay");
        if (overlay) overlay.style.display = "flex";
      }
      return res;
    });
  };
})();

function hacerLogin() {
  const usuario = document.getElementById("loginUsuario").value.trim();
  const password = document.getElementById("loginPassword").value;
  const recordar = document.getElementById("loginRecordar").checked;
  const errorDiv = document.getElementById("loginError");
  if (!usuario || !password) { errorDiv.innerText = "Completa ambos campos"; errorDiv.style.display = "block"; return; }
  fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ usuario, password }) })
    .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
    .then(({ ok, data }) => {
      if (ok) {
        localStorage.setItem("token_admin", data.token); if (data.tokenExport) localStorage.setItem("token_export", data.tokenExport);
        if (recordar) { localStorage.setItem("rec_user", usuario); localStorage.setItem("rec_pass", password); }
        else { localStorage.removeItem("rec_user"); localStorage.removeItem("rec_pass"); }
        document.getElementById("loginOverlay").style.display = "none";
      }
      else { errorDiv.innerText = data.error; errorDiv.style.display = "block"; }
    });
}
(function() {
  const savedUser = localStorage.getItem("rec_user");
  const savedPass = localStorage.getItem("rec_pass");
  if (savedUser && savedPass) {
    fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ usuario: savedUser, password: savedPass }) })
      .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
      .then(({ ok, data }) => {
        if (ok) { localStorage.setItem("token_admin", data.token); if (data.tokenExport) localStorage.setItem("token_export", data.tokenExport); document.getElementById("loginOverlay").style.display = "none"; }
      });
    return;
  }
  const token = localStorage.getItem("token_admin");
  if (token) {
    fetch("/verificar-token", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) })
      .then(r => r.ok ? r.json().then(d => ({ ok: true, data: d })) : { ok: false, data: {} })
      .then(({ ok, data }) => {
        if (!ok) return;
        if (data.tokenExport) localStorage.setItem("token_export", data.tokenExport);
        document.getElementById("loginOverlay").style.display = "none";
      });
  }
})();
</script>

<script>
  const socket = io();
  const contenedor = document.getElementById("pedidos");
  let fechaActual = "";
  let tabActual = "dia";
  let todasLasFechas = [];

  const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const DIAS_SEMANA = ["Dom","Lun","Mar","Mie","Jue","Vie","Sab"];

  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("open");
  }

  function setActiveNav(btn) {
    document.querySelectorAll(".quick-nav button").forEach(b => b.classList.remove("activo"));
    document.querySelectorAll(".tree-day").forEach(d => d.classList.remove("activo"));
    if (btn) btn.classList.add("activo");
    if (window.innerWidth <= 768) {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarOverlay").classList.remove("open");
    }
  }

  function navHoy(btn) {
    setActiveNav(btn);
    tabActual = "dia";
    const hoy = fechaHoyStr();
    if (todasLasFechas.includes(hoy)) {
      cargarFecha(hoy);
    } else if (todasLasFechas.length > 0) {
      cargarFecha(todasLasFechas[todasLasFechas.length - 1]);
    } else {
      setTitulo("Sin ventas", "");
      actualizarMetricas(0, 0, 0, 0);
      mostrarGraficas(false);
      contenedor.innerHTML = '<div class="sin-datos">No hay ventas registradas</div>';

  function fechaHoyStr() {
    return new Date().toLocaleDateString("es-MX", { timeZone: "America/Mexico_City", day: "2-digit", month: "2-digit", year: "numeric" });
  }

  // Build date tree
  function construirArbolFechas(fechas) {
    const arbol = {};

    fechas.forEach(f => {
      const [d, m, y] = f.split("/");
      const dia = parseInt(d);
      const mes = parseInt(m) - 1;
      const anio = y;
      const semana = Math.ceil(dia / 7);
      const date = new Date(parseInt(y), mes, dia);
      const diaSemana = DIAS_SEMANA[date.getDay()];

      if (!arbol[anio]) arbol[anio] = {};
      if (!arbol[anio][mes]) arbol[anio][mes] = {};
      if (!arbol[anio][mes][semana]) arbol[anio][mes][semana] = [];
      arbol[anio][mes][semana].push({ fecha: f, dia, diaSemana });
    });

    let html = "";
    const anios = Object.keys(arbol).sort((a, b) => b - a);

    anios.forEach((anio, ai) => {
      const expandidoAnio = ai === 0;
      html += '<div class="tree-node tree-year" onclick="toggleTree(this)">';
      html += '<span class="tree-toggle">' + (expandidoAnio ? "&#9660;" : "&#9654;") + '</span> ' + anio;
      html += '</div>';
      html += '<div class="tree-children' + (expandidoAnio ? '' : ' collapsed') + '">';

      const meses = Object.keys(arbol[anio]).sort((a, b) => b - a);
      meses.forEach((mes, mi) => {
        const expandidoMes = ai === 0 && mi === 0;
        html += '<div class="tree-node tree-month" onclick="toggleTree(this)">';
        html += '<span class="tree-toggle">' + (expandidoMes ? "&#9660;" : "&#9654;") + '</span> ' + MESES[mes];
        html += '</div>';
        html += '<div class="tree-children' + (expandidoMes ? '' : ' collapsed') + '">';

        const semanas = Object.keys(arbol[anio][mes]).sort((a, b) => b - a);
        semanas.forEach((sem, si) => {
          const expandidoSem = ai === 0 && mi === 0 && si === 0;
          html += '<div class="tree-node tree-week" onclick="toggleTree(this)">';
          html += '<span class="tree-toggle">' + (expandidoSem ? "&#9660;" : "&#9654;") + '</span> Semana ' + sem;
          html += '</div>';
          html += '<div class="tree-children' + (expandidoSem ? '' : ' collapsed') + '">';

          const dias = arbol[anio][mes][sem].sort((a, b) => a.dia - b.dia);
          dias.forEach(d => {
            html += '<div class="tree-day" onclick="seleccionarDia(\'' + d.fecha + '\', this)">' + d.diaSemana + ' ' + d.dia + '</div>';
          });

          html += '</div>';
        });

        html += '</div>';
      });

      html += '</div>';
    });

    document.getElementById("arbolFechas").innerHTML = html;
  }

  function toggleTree(el) {
    const children = el.nextElementSibling;
    if (!children || !children.classList.contains("tree-children")) return;
    const toggle = el.querySelector(".tree-toggle");
    children.classList.toggle("collapsed");
    if (toggle) toggle.innerHTML = children.classList.contains("collapsed") ? "&#9654;" : "&#9660;";
  }

  function actualizarMetricas(total, totalEfectivo, totalTarjeta, numPedidos, totalAnterior, productoEstrella) {
    document.getElementById("metricTotal").innerText = "$" + (total || 0).toLocaleString();
    document.getElementById("metricEfectivo").innerText = "$" + (totalEfectivo || 0).toLocaleString();
    document.getElementById("metricTarjeta").innerText = "$" + (totalTarjeta || 0).toLocaleString();
    document.getElementById("metricPedidos").innerText = numPedidos || 0;

    // Ticket promedio
    const promedio = numPedidos > 0 ? Math.round(total / numPedidos) : 0;
    document.getElementById("metricPromedio").innerText = "$" + promedio.toLocaleString();

    // Producto estrella
    document.getElementById("metricEstrella").innerText = productoEstrella ? productoEstrella.nombre + " (" + productoEstrella.cantidad + ")" : "-";

    // Comparativo
    const compareEl = document.getElementById("metricCompare");
    if (totalAnterior !== undefined && totalAnterior > 0) {
      const pct = Math.round(((total - totalAnterior) / totalAnterior) * 100);
      if (pct > 0) {
        compareEl.className = "metric-compare up";
        compareEl.innerHTML = "&#9650; +" + pct + "%";
      } else if (pct < 0) {
        compareEl.className = "metric-compare down";
        compareEl.innerHTML = "&#9660; " + pct + "%";
      } else {
        compareEl.className = "metric-compare neutral";
        compareEl.innerText = "= 0%";
      }
    } else if (totalAnterior !== undefined && totalAnterior === 0 && total > 0) {
      compareEl.className = "metric-compare up";
      compareEl.innerHTML = "&#9650; nuevo";
    } else {
      compareEl.className = "metric-compare neutral";
      compareEl.innerText = "";
    }
  }

  // Filtro por forma de pago: se combina con el buscador de cliente
  let pagoActual = "todos";

  function filtrarPedidos() {
    const q = document.getElementById("buscadorCliente").value.toLowerCase().trim();
    document.querySelectorAll("#pedidos .pedido").forEach(div => {
      const cliente = div.querySelector(".cliente");
      if (!cliente) return;
      const coincideTexto = !q || cliente.innerText.toLowerCase().includes(q);
      const coincidePago = pagoActual === "todos" || div.dataset.pago === pagoActual;
      div.style.display = coincideTexto && coincidePago ? "" : "none";
    });
  }

  function filtrarPorPago(tipo) {
    pagoActual = tipo;
    document.querySelectorAll("#filtroPago button").forEach(b => {
      b.classList.toggle("activo", b.dataset.pago === tipo);
    });
    filtrarPedidos();
  }

  // Botones con el total y el número de pedidos de cada forma de pago
  function renderFiltroPago(lista) {
    const cont = document.getElementById("filtroPago");
    if (!lista || lista.length === 0) {
      cont.style.display = "none";
      cont.innerHTML = "";
      return;
    }

    const grupos = [
      { tipo: "todos", etiqueta: "Todos" },
      { tipo: "efectivo", etiqueta: "Efectivo" },
      { tipo: "tarjeta", etiqueta: "Tarjeta" },
      { tipo: "online", etiqueta: "Online" }
    ];

    cont.innerHTML = grupos.map(g => {
      const suyos = g.tipo === "todos" ? lista : lista.filter(p => tipoPago(p) === g.tipo);
      const monto = suyos.reduce((acc, p) => acc + (p.total || 0), 0);
      return '<button data-pago="' + g.tipo + '" class="' + (g.tipo === pagoActual ? "activo" : "") + '"' +
             ' onclick="filtrarPorPago(\'' + g.tipo + '\')">' +
             '<span>' + g.etiqueta + '</span>' +
             '<span class="fp-monto">$' + Math.round(monto * 100) / 100 + '</span>' +
             '<span class="fp-num">' + suyos.length + '</span>' +
             '</button>';
    }).join("");

    cont.style.display = "flex";
  }

  function renderBarChart(categorias, containerId) {
    const container = document.getElementById(containerId);
    if (!categorias || categorias.length === 0) {
      container.innerHTML = '<div class="chart-title">Categorias</div><div style="color:#ccc;font-size:13px;">Sin datos</div>';
      return;
    }
    const maxCant = Math.max(...categorias.map(c => c.cantidad));
    let html = '<div class="chart-title">Ventas por Categoria</div>';
    categorias.forEach(c => {
      const pct = Math.round((c.cantidad / maxCant) * 100);
      html += '<div class="bar-row">';
      html += '<span class="bar-label">' + c.nombre + '</span>';
      html += '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>';
      html += '<span class="bar-value">' + c.cantidad + ' &middot; $' + c.total + '</span>';
      html += '</div>';
    });
    container.innerHTML = html;
  }

  function renderHourChart(porHora, containerId) {
    const container = document.getElementById(containerId);
    if (!porHora || porHora.length === 0) {
      container.innerHTML = '<div class="chart-title">Hora Pico</div><div style="color:#ccc;font-size:13px;">Sin datos</div>';
      return;
    }
    const maxPed = Math.max(...porHora.map(h => h.pedidos));
    let html = '<div class="chart-title">Ventas por Hora</div><div class="hour-chart">';
    porHora.forEach(h => {
      const height = Math.max(2, Math.round((h.pedidos / maxPed) * 100));
      html += '<div class="hour-col">';
      html += '<div class="hour-bar" style="height:' + height + '%">';
      html += '<span class="hour-bar-count">' + h.pedidos + '</span>';
      html += '</div>';
      html += '<span class="hour-label">' + h.hora.replace(":00", "") + '</span>';
      html += '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
  }

  function renderDayBarChart(porDia, containerId, color) {
    const container = document.getElementById(containerId);
    if (!porDia) { container.innerHTML = ''; return; }

    const fechas = Object.keys(porDia).sort((a, b) => {
      const [da, ma, ya] = a.split("/");
      const [db, mb, yb] = b.split("/");
      return new Date(yb, mb-1, db) - new Date(ya, ma-1, da);
    });

    if (fechas.length === 0) { container.innerHTML = ''; return; }

    const maxTotal = Math.max(...fechas.map(f => porDia[f].total));
    let html = '<div class="chart-title">Por Dia</div>';
    fechas.forEach(f => {
      const info = porDia[f];
      const pct = maxTotal > 0 ? Math.round((info.total / maxTotal) * 100) : 0;
      const [d, m] = f.split("/");
      const dateObj = new Date(parseInt(f.split("/")[2]), parseInt(m) - 1, parseInt(d));
      const diaSemana = DIAS_SEMANA[dateObj.getDay()];
      html += '<div class="bar-row" style="cursor:pointer" onclick="seleccionarDia(\'' + f + '\')">';
      html += '<span class="bar-label">' + diaSemana + ' ' + d + '</span>';
      html += '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>';
      html += '<span class="bar-value">' + info.pedidos.length + 'p &middot; $' + info.total + '</span>';
      html += '</div>';
    });
    container.innerHTML = html;
  }

  // Productos
  let periodoProductos = "dia";

  function cargarProductos() {
    limpiarContenido();
    mostrarGraficas(false);
    mostrarMetricas(false);
    mostrarAcciones(false);
    setTitulo("Productos Vendidos", "");

    const hoy = new Date().toLocaleDateString("es-MX", { timeZone: "America/Mexico_City", year: "numeric", month: "2-digit", day: "2-digit" });

    let selectorHtml = '<div class="tab-productos">';
    ["dia", "semana", "mes"].forEach(p => {
      const label = p === "dia" ? "Hoy" : p === "semana" ? "Semana" : "Mes";
      selectorHtml += '<button class="' + (p === periodoProductos ? "activo" : "") + '" onclick="periodoProductos=\'' + p + '\';cargarProductos()">' + label + '</button>';
    });
    selectorHtml += '</div>';
    document.getElementById("contenidoExtra").innerHTML = selectorHtml;

    let url = "/ventas/productos-vendidos?periodo=" + periodoProductos;
    if (periodoProductos === "dia") url += "&fecha=" + encodeURIComponent(hoy);

    fetch(url)
      .then(res => res.json())
      .then(data => {
        if (data.productos.length === 0) {
          contenedor.innerHTML = '<div class="sin-datos">No hay productos vendidos</div>';
          return;
        }

        let html = '';
        const dias = data.porDia || [{ fecha: "Hoy", productos: data.productos, categorias: data.categorias }];
        const TOP = 5;

        dias.forEach((dia, idx) => {
          const [d, m] = (dia.fecha || "").split("/");
          const dateObj = d && m ? new Date(parseInt(dia.fecha.split("/")[2]), parseInt(m) - 1, parseInt(d)) : null;
          const diaSemana = dateObj ? DIAS_SEMANA[dateObj.getDay()] : "";
          const tituloFecha = dateObj ? diaSemana + " " + d + " de " + MESES[parseInt(m) - 1] : dia.fecha;
          const totalDia = dia.productos.reduce((a, p) => a + p.total, 0);
          const totalCant = dia.productos.reduce((a, p) => a + p.cantidad, 0);

          html += '<div style="margin-bottom:16px;background:#f8f8f8;border-radius:12px;padding:16px;">';
          html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;cursor:pointer;" onclick="toggleProductosDia(\'prodDia' + idx + '\')">';
          html += '<div style="font-size:15px;font-weight:600;color:#1a1a1a;">' + tituloFecha + '</div>';
          html += '<div style="font-size:13px;color:#999;">' + totalCant + ' productos &middot; <span style="color:#22c55e;font-weight:700;">$' + totalDia + '</span></div>';
          html += '</div>';

          // Top products (always visible)
          html += '<table class="tabla-productos"><thead><tr><th>#</th><th>Producto</th><th style="text-align:center">Cant.</th><th style="text-align:right">Total</th></tr></thead><tbody>';
          dia.productos.slice(0, TOP).forEach((p, i) => {
            html += '<tr><td class="col-rank">' + (i + 1) + '</td><td class="col-nombre">' + p.nombre + '</td><td class="col-cant">' + p.cantidad + '</td><td class="col-total">$' + p.total + '</td></tr>';
          });
          html += '</tbody></table>';

          // Full list (hidden by default)
          if (dia.productos.length > TOP) {
            html += '<div id="prodDia' + idx + '" style="display:none;margin-top:10px;">';

            // Categories
            if (dia.categorias && dia.categorias.length > 0) {
              html += '<table class="tabla-productos" style="margin-bottom:10px;"><thead><tr><th>Categoria</th><th style="text-align:center">Cant.</th><th style="text-align:right">Total</th></tr></thead><tbody>';
              dia.categorias.forEach(c => {
                html += '<tr><td class="col-nombre">' + c.nombre + '</td><td class="col-cant">' + c.cantidad + '</td><td class="col-total">$' + c.total + '</td></tr>';
              });
              html += '</tbody></table>';
            }

            // Rest of products
            html += '<table class="tabla-productos"><thead><tr><th>#</th><th>Producto</th><th style="text-align:center">Cant.</th><th style="text-align:right">Total</th></tr></thead><tbody>';
            dia.productos.slice(TOP).forEach((p, i) => {
              html += '<tr><td class="col-rank">' + (TOP + i + 1) + '</td><td class="col-nombre">' + p.nombre + '</td><td class="col-cant">' + p.cantidad + '</td><td class="col-total">$' + p.total + '</td></tr>';
            });
            html += '</tbody></table>';
            html += '</div>';
            html += '<div style="text-align:center;margin-top:8px;">';
            html += '<button onclick="toggleProductosDia(\'prodDia' + idx + '\', this)" style="border:none;background:transparent;color:#3b82f6;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;">Ver todos (' + dia.productos.length + ')</button>';
            html += '</div>';
          }

          html += '</div>';
        });

        contenedor.innerHTML = html;
      });
  }

  // En la vista de un solo día la fecha ya va en el título; en semana y mes
  // sí hace falta para ubicar cada pedido
  let mostrarFechaEnPedido = false;

  // Forma de pago de un pedido, para el filtro y las etiquetas.
  // Los pedidos de la página del cliente van como "online" aunque no traigan
  // metodoPago: se cobraron por Mercado Pago, no en la caja.
  function tipoPago(pedido) {
    if (pedido.origen === "cliente") return "online";
    if (pedido.metodoPago === "tarjeta") return "tarjeta";
    return "efectivo";
  }

  function mostrarPedido(pedido) {
    const div = document.createElement("div");
    div.className = "pedido";
    const prods = pedido.productos.map(p => (p.cantidad > 1 ? p.cantidad + "x " : "") + p.nombre).join(", ");
    // Hora en que se entregó. Los pedidos viejos no la traen, ahí se usa la de envío.
    const hora = pedido.horaEntrega || pedido.horaEnvio || "";
    const tipo = tipoPago(pedido);
    div.dataset.pago = tipo;

    div.innerHTML =
      '<div class="pedido-header">' +
        '<div style="flex:1;min-width:0;">' +
          '<span class="cliente">' + pedido.cliente + '</span>' +
          (tipo === "tarjeta" ? '<span class="badge-tarjeta">TARJETA</span>' : '') +
          (tipo === "online" ? '<span class="badge-online">ONLINE</span>' : '') +
          (hora ? '<span class="pedido-hora">' + (mostrarFechaEnPedido && pedido.fecha ? pedido.fecha + ' · ' : '') + hora + '</span>' : '') +
          '<div class="pedido-prods">' + prods + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">' +
          '<span class="pedido-total">$' + pedido.total + '</span>' +
          '<button class="btn-eliminar" onclick="eliminarPedido(' + pedido.id + ')">&#10005;</button>' +
        '</div>' +
      '</div>';

    contenedor.prepend(div);
  }

  function eliminarPedido(id) {
    const pass = prompt("Ingresa la contrasena para eliminar:");
    if (!pass) return;

    fetch("/pedido/" + id, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pass })
    })
      .then(res => {
        if (!res.ok) alert("Contrasena incorrecta");
      });
  }

  // Las descargas van por URL (window.open y correo no admiten encabezados),
  // así que llevan la llave de reportes, que caduca sola cada semana.
  function llaveReportes(url) {
    const t = localStorage.getItem("token_export");
    if (!t) return url;
    return url + (url.indexOf("?") === -1 ? "?" : "&") + "t=" + encodeURIComponent(t);
  }

  function exportarExcel() {
    let url;
    if (tabActual === "dia") {
      if (!fechaActual) return;
      url = "/ventas/exportar/dia?fecha=" + encodeURIComponent(fechaActual);
    } else if (tabActual === "semana") {
      url = "/ventas/exportar/semana";
    } else {
      url = "/ventas/exportar/mes";
    }
    window.open(llaveReportes(url), "_blank");
  }

  function enviarCorreo() {
    let url;
    if (tabActual === "dia") {
      if (!fechaActual) return;
      url = llaveReportes(window.location.origin + "/ventas/exportar/dia?fecha=" + encodeURIComponent(fechaActual));
    } else if (tabActual === "semana") {
      url = llaveReportes(window.location.origin + "/ventas/exportar/semana");
    } else {
      url = llaveReportes(window.location.origin + "/ventas/exportar/mes");
    }

    const totalTxt = document.getElementById("metricTotal").innerText;
    const asunto = encodeURIComponent("Ventas - " + tabActual + " - " + totalTxt);
    const cuerpo = encodeURIComponent("Descarga el reporte de ventas aqui:\n" + url);
    window.open("mailto:?subject=" + asunto + "&body=" + cuerpo);
  }

  function agregarGasto() {
    const concepto = document.getElementById("gastoConcepto").value.trim();
    const monto = document.getElementById("gastoMonto").value;
    if (!concepto || !monto || parseFloat(monto) <= 0) return alert("Completa concepto y monto");

    fetch("/gasto", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ concepto, monto: parseFloat(monto) })
    })
      .then(res => res.json())
      .then(() => navCorte(document.querySelector('.quick-nav button:nth-child(5)')));
  }

  function eliminarGasto(id) {
    const pass = prompt("Contrasena para eliminar:");
    if (!pass) return;
    fetch("/gasto/" + id, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pass })
    }).then(res => {
      if (!res.ok) return alert("Contrasena incorrecta");
      navCorte(document.querySelector('.quick-nav button:nth-child(5)'));
    });
  }

  // Corte de Caja
  let corteFecha = "";
  let corteMes = "";  // "MM/YYYY" del mes que se está viendo en el calendario

  function mesDeFecha(f) {
    const [, m, y] = f.split("/");
    return m + "/" + y;
  }

  // Meses que tienen ventas registradas, del más viejo al más nuevo
  function mesesConVentas() {
    const meses = new Set(todasLasFechas.map(mesDeFecha));
    meses.add(mesDeFecha(fechaHoyStr()));
    return Array.from(meses).sort((a, b) => {
      const [ma, ya] = a.split("/"), [mb, yb] = b.split("/");
      return (parseInt(ya) - parseInt(yb)) || (parseInt(ma) - parseInt(mb));
    });
  }

  window.cambiarMesCorte = function(delta) {
    const meses = mesesConVentas();
    const i = meses.indexOf(corteMes);
    const destino = meses[i + delta];
    if (!destino) return;
    corteMes = destino;
    renderCalendarioCorte();
  };

  function renderCalendarioCorte() {
    const meses = mesesConVentas();
    if (!corteMes || meses.indexOf(corteMes) === -1) corteMes = meses[meses.length - 1];

    const [mesStr, anioStr] = corteMes.split("/");
    const mes = parseInt(mesStr), anio = parseInt(anioStr);
    const hoy = fechaHoyStr();
    const i = meses.indexOf(corteMes);
    const hayAnterior = i > 0, haySiguiente = i < meses.length - 1;

    const flecha = (delta, simbolo, activa) =>
      '<button onclick="cambiarMesCorte(' + delta + ')" ' + (activa ? '' : 'disabled ') +
      'style="width:32px;height:32px;border:1px solid #e5e5e5;background:#fff;color:' + (activa ? '#333' : '#ccc') +
      ';border-radius:8px;cursor:' + (activa ? 'pointer' : 'default') + ';font-family:inherit;font-size:14px;">' + simbolo + '</button>';

    let html = '<div id="selectorCorte" style="border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:16px;max-width:340px;">';

    // Encabezado con el mes y las flechas
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">';
    html += flecha(-1, "&#8249;", hayAnterior);
    html += '<div style="font-size:14px;font-weight:600;">' + MESES[mes - 1] + ' ' + anio + '</div>';
    html += flecha(1, "&#8250;", haySiguiente);
    html += '</div>';

    // Días de la semana (inicia en lunes)
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;">';
    ["Lun", "Mar", "Mie", "Jue", "Vie", "Sab", "Dom"].forEach(d => {
      html += '<div style="text-align:center;font-size:11px;color:#999;padding:2px 0;">' + d + '</div>';
    });
    html += '</div>';

    // Cuadrícula de días
    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">';
    const primero = new Date(anio, mes - 1, 1);
    const huecos = (primero.getDay() + 6) % 7;  // lunes = 0
    for (let h = 0; h < huecos; h++) html += '<div></div>';

    const diasDelMes = new Date(anio, mes, 0).getDate();
    for (let d = 1; d <= diasDelMes; d++) {
      const fecha = String(d).padStart(2, "0") + "/" + String(mes).padStart(2, "0") + "/" + anio;
      const tieneVentas = todasLasFechas.includes(fecha);
      const esHoyDia = fecha === hoy;
      const activo = fecha === corteFecha;

      if (!tieneVentas && !esHoyDia) {
        html += '<div style="text-align:center;padding:7px 0;font-size:13px;color:#ddd;">' + d + '</div>';
        continue;
      }

      const fondo = activo ? '#3b82f6' : (esHoyDia ? '#eff6ff' : '#fff');
      const texto = activo ? '#fff' : '#333';
      const borde = activo ? '#3b82f6' : (esHoyDia ? '#bfdbfe' : '#e5e5e5');
      html += '<button onclick="navCorte(null,\'' + fecha + '\')" style="padding:7px 0;font-size:13px;font-weight:' +
        (activo ? '600' : '400') + ';border:1px solid ' + borde + ';background:' + fondo + ';color:' + texto +
        ';border-radius:8px;cursor:pointer;font-family:inherit;">' + d + '</button>';
    }
    html += '</div></div>';

    document.getElementById("contenidoExtra").innerHTML = html;
  }

  function navCorte(btn, fecha) {
    if (btn) setActiveNav(btn);
    tabActual = "corte";
    limpiarContenido();
    mostrarGraficas(false);
    mostrarMetricas(false);
    mostrarAcciones(false);

    const hoy = fechaHoyStr();
    corteFecha = fecha || hoy;
    const esHoy = corteFecha === hoy;
    setTitulo("Corte de Caja", corteFecha);

    // Selector de fecha: calendario del mes
    corteMes = mesDeFecha(corteFecha);
    renderCalendarioCorte();

    Promise.all([
      fetch("/ventas/fecha/" + encodeURIComponent(corteFecha)).then(r => r.json()),
      fetch("/gastos/" + encodeURIComponent(corteFecha)).then(r => r.json()),
      fetch("/ventas/eliminados/" + encodeURIComponent(corteFecha)).then(r => r.json()),
      fetch("/fondo-caja/" + encodeURIComponent(corteFecha)).then(r => r.json()),
      fetch("/retiros/" + encodeURIComponent(corteFecha)).then(r => r.json()),
      fetch("/ventas-tarjeta/" + encodeURIComponent(corteFecha)).then(r => r.json())
    ]).then(([ventas, gastosData, eliminados, fondoData, retirosData, tarjetaData]) => {
      const totalVentas = ventas.total || 0;
      const totalEfectivo = ventas.totalEfectivo || 0;
      const totalTarjeta = ventas.totalTarjeta || 0;
      const totalTarjetaManual = tarjetaData.totalVentasTarjeta || 0;
      const totalTarjetaFinal = totalTarjeta + totalTarjetaManual;
      const totalVentasFinal = totalVentas + totalTarjetaManual;
      const numPedidos = ventas.pedidos ? ventas.pedidos.length : 0;
      const totalGastos = gastosData.totalGastos || 0;
      const totalRetiros = retirosData.totalRetiros || 0;
      const fondoCaja = fondoData.monto || 0;
      const utilidad = totalVentasFinal - totalGastos + totalRetiros;
      const estrella = ventas.productoEstrella;
      const efectivoEnCaja = fondoCaja + totalEfectivo - totalGastos - totalRetiros;

      let html = '<div id="corteImprimir">';

      // Header
      html += '<div style="text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid #eee;">';
      html += '<div style="font-size:20px;font-weight:700;">Corte de Caja</div>';
      html += '<div style="font-size:13px;color:#999;">' + corteFecha + '</div>';
      html += '</div>';

      // Fondo de caja
      html += '<div style="background:#f8f8f8;border-radius:12px;padding:20px;margin-bottom:12px;">';
      html += '<div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Fondo de Caja</div>';
      if (esHoy) {
        html += '<div style="display:flex;align-items:center;gap:10px;">';
        html += '<input type="number" id="fondoCajaInput" value="' + fondoCaja + '" placeholder="$0" style="width:140px;padding:10px;font-size:16px;font-weight:700;border:1px solid #e5e5e5;border-radius:8px;font-family:inherit;outline:none;text-align:center;">';
        html += '<button onclick="guardarFondo()" style="padding:10px 16px;font-size:13px;font-weight:600;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">Guardar</button>';
        html += '</div>';
      } else {
        html += '<div style="font-size:18px;font-weight:700;">$' + fondoCaja.toLocaleString() + '</div>';
      }
      html += '</div>';

      // Ventas
      html += '<div style="background:#f8f8f8;border-radius:12px;padding:20px;margin-bottom:12px;">';
      html += '<div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Ventas</div>';
      html += filaCorte("Total Ventas", "$" + totalVentasFinal.toLocaleString(), "#22c55e", true);
      html += filaCorte("Efectivo", "$" + totalEfectivo.toLocaleString(), "#22c55e");
      html += filaCorte("Tarjeta (sistema)", "$" + totalTarjeta.toLocaleString(), "#3b82f6");
      if (totalTarjetaManual > 0) html += filaCorte("Tarjeta (manual)", "$" + totalTarjetaManual.toLocaleString(), "#3b82f6");
      html += filaCorte("Total Tarjeta", "$" + totalTarjetaFinal.toLocaleString(), "#3b82f6", true);
      html += filaCorte("Pedidos", numPedidos, "#f59e0b");
      if (estrella) html += filaCorte("Producto Estrella", estrella.nombre + " (" + estrella.cantidad + ")", "#f59e0b");
      html += '</div>';

      // Ventas tarjeta manual
      html += '<div style="background:#f8f8f8;border-radius:12px;padding:20px;margin-bottom:12px;">';
      html += '<div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Ventas con Tarjeta</div>';
      if (esHoy) {
        html += '<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;">';
        html += '<div style="flex:1;min-width:120px;"><input type="text" id="tarjetaConcepto" placeholder="Concepto (opcional)" style="width:100%;padding:8px;font-size:13px;border:1px solid #e5e5e5;border-radius:8px;font-family:inherit;outline:none;"></div>';
        html += '<div style="width:100px;"><input type="number" id="tarjetaMonto" placeholder="$0" style="width:100%;padding:8px;font-size:13px;border:1px solid #e5e5e5;border-radius:8px;font-family:inherit;outline:none;"></div>';
        html += '<button onclick="agregarVentaTarjeta()" style="padding:8px 14px;font-size:13px;font-weight:600;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">Agregar</button>';
        html += '</div>';
      }
      if (tarjetaData.ventas && tarjetaData.ventas.length > 0) {
        tarjetaData.ventas.forEach(v => {
          html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;">';
          html += '<span style="font-size:13px;color:#666;">' + v.concepto + ' <span style="color:#999;font-size:11px;">' + v.hora + '</span></span>';
          html += '<div style="display:flex;align-items:center;gap:8px;">';
          html += '<span style="font-size:14px;font-weight:600;color:#3b82f6;">$' + v.monto.toLocaleString() + '</span>';
          html += '<button onclick="eliminarVentaTarjeta(' + v.id + ')" style="border:none;background:transparent;color:#ccc;cursor:pointer;font-size:13px;">&#10005;</button>';
          html += '</div></div>';
        });
      } else if (!esHoy) {
        html += '<div style="color:#ccc;font-size:13px;">Sin ventas manuales</div>';
      }
      html += '</div>';

      // Gastos
      html += '<div style="background:#f8f8f8;border-radius:12px;padding:20px;margin-bottom:12px;">';
      html += '<div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Gastos</div>';
      if (esHoy) {
        html += '<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;">';
        html += '<div style="flex:1;min-width:120px;"><input type="text" id="gastoConcepto" placeholder="Concepto" style="width:100%;padding:8px;font-size:13px;border:1px solid #e5e5e5;border-radius:8px;font-family:inherit;outline:none;"></div>';
        html += '<div style="width:100px;"><input type="number" id="gastoMonto" placeholder="$0" style="width:100%;padding:8px;font-size:13px;border:1px solid #e5e5e5;border-radius:8px;font-family:inherit;outline:none;"></div>';
        html += '<button onclick="agregarGasto()" style="padding:8px 14px;font-size:13px;font-weight:600;background:#ef4444;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">Agregar</button>';
        html += '</div>';
      }
      html += filaCorte("Total Gastos", "-$" + totalGastos.toLocaleString(), "#ef4444", true);
      if (gastosData.gastos && gastosData.gastos.length > 0) {
        gastosData.gastos.forEach(g => {
          html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;">';
          html += '<span style="font-size:13px;color:#666;">' + g.concepto + ' <span style="color:#999;font-size:11px;">' + g.hora + '</span></span>';
          html += '<div style="display:flex;align-items:center;gap:8px;">';
          html += '<span style="font-size:14px;font-weight:600;color:#ef4444;">-$' + g.monto.toLocaleString() + '</span>';
          html += '<button onclick="eliminarGasto(' + g.id + ')" style="border:none;background:transparent;color:#ccc;cursor:pointer;font-size:13px;">&#10005;</button>';
          html += '</div></div>';
        });
      }
      html += '</div>';

      // Retiros
      html += '<div style="background:#f8f8f8;border-radius:12px;padding:20px;margin-bottom:12px;">';
      html += '<div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Retiros de Dinero</div>';
      if (esHoy) {
        html += '<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;">';
        html += '<div style="flex:1;min-width:120px;"><input type="text" id="retiroConcepto" placeholder="Concepto (opcional)" style="width:100%;padding:8px;font-size:13px;border:1px solid #e5e5e5;border-radius:8px;font-family:inherit;outline:none;"></div>';
        html += '<div style="width:100px;"><input type="number" id="retiroMonto" placeholder="$0" style="width:100%;padding:8px;font-size:13px;border:1px solid #e5e5e5;border-radius:8px;font-family:inherit;outline:none;"></div>';
        html += '<button onclick="agregarRetiro()" style="padding:8px 14px;font-size:13px;font-weight:600;background:#f59e0b;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">Retirar</button>';
        html += '</div>';
      }
      html += filaCorte("Total Retiros", "-$" + totalRetiros.toLocaleString(), "#f59e0b", true);
      if (retirosData.retiros && retirosData.retiros.length > 0) {
        retirosData.retiros.forEach(r => {
          html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;">';
          html += '<span style="font-size:13px;color:#666;">' + r.concepto + ' <span style="color:#999;font-size:11px;">' + r.hora + '</span></span>';
          html += '<div style="display:flex;align-items:center;gap:8px;">';
          html += '<span style="font-size:14px;font-weight:600;color:#f59e0b;">-$' + r.monto.toLocaleString() + '</span>';
          html += '<button onclick="eliminarRetiro(' + r.id + ')" style="border:none;background:transparent;color:#ccc;cursor:pointer;font-size:13px;">&#10005;</button>';
          html += '</div></div>';

      html += '<span style="font-size:16px;font-weight:700;">UTILIDAD NETA</span>';
      html += '<span style="font-size:24px;font-weight:800;color:#f59e0b;">$' + utilidad.toLocaleString() + '</span>';
      html += '</div></div>';

      html += '<div style="background:#f0fdf4;border-radius:12px;padding:20px;margin-bottom:12px;border:2px solid #22c55e;">';

      html += '<span style="font-size:16px;font-weight:700;">EFECTIVO EN CAJA</span>';
      html += '<span style="font-size:24px;font-weight:800;color:#22c55e;">$' + efectivoEnCaja.toLocaleString() + '</span>';
      html += '</div>';
      html += '<div style="font-size:11px;color:#999;margin-top:6px;">Fondo ($' + fondoCaja + ') + Efectivo ($' + totalEfectivo + ') - Gastos ($' + totalGastos + ') - Retiros ($' + totalRetiros + ')</div>';
      html += '</div>';

      // Ventas con tarjeta (azul)
      html += '<div style="background:#eff6ff;border-radius:12px;padding:20px;margin-bottom:12px;border:2px solid #3b82f6;">';

      html += '<span style="font-size:24px;font-weight:800;color:#3b82f6;">$' + totalTarjetaFinal.toLocaleString() + '</span>';
      html += '</div></div>';

      // Eliminados
      if (eliminados.length > 0) {
        const totalElim = eliminados.reduce((a, p) => a + (p.total || 0), 0);
        html += '<div style="background:#f8f8f8;border-radius:12px;padding:20px;margin-bottom:12px;">';
        html += '<div style="font-size:11px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Pedidos Eliminados (' + eliminados.length + ')</div>';
        eliminados.forEach(p => {
          const prods = p.productos ? p.productos.map(pr => pr.nombre).join(", ") : "";
          html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:13px;">';

          html += '<span style="color:#ef4444;font-weight:600;">$' + (p.total || 0) + '</span>';

        });
        html += '<div style="display:flex;justify-content:space-between;margin-top:8px;font-weight:700;font-size:14px;">';
        html += '<span>Total Eliminado</span><span style="color:#ef4444;">$' + totalElim.toLocaleString() + '</span></div>';

      html += '</div>';

      // Buttons
      html += '<div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">';
      html += '<button onclick="imprimirCorte()" style="padding:12px 32px;font-size:14px;font-weight:600;background:#1a1a1a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">Imprimir</button>';
      html += '<button onclick="descargarCorte()" style="padding:12px 32px;font-size:14px;font-weight:600;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">Descargar</button>';
      html += '</div>';

      contenedor.innerHTML = html;
    });
  }

  function guardarFondo() {
    const monto = document.getElementById("fondoCajaInput").value;
    fetch("/fondo-caja", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ monto: parseFloat(monto) || 0 })
    }).then(() => navCorte(document.querySelector('.quick-nav button:nth-child(5)')));
  }

  function agregarRetiro() {
    const concepto = document.getElementById("retiroConcepto").value.trim() || "Retiro";
    const monto = document.getElementById("retiroMonto").value;
    if (!monto || parseFloat(monto) <= 0) return alert("Ingresa el monto del retiro");
    fetch("/retiro", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ concepto, monto: parseFloat(monto) })
    }).then(() => navCorte(document.querySelector('.quick-nav button:nth-child(5)')));
  }

  function eliminarRetiro(id) {
    const pass = prompt("Contrasena para eliminar:");
    if (!pass) return;
    fetch("/retiro/" + id, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pass })
    }).then(res => {
      if (!res.ok) return alert("Contrasena incorrecta");
      navCorte(document.querySelector('.quick-nav button:nth-child(5)'));
    });
  }

  function agregarVentaTarjeta() {
    const concepto = document.getElementById("tarjetaConcepto").value.trim() || "Tarjeta";
    const monto = document.getElementById("tarjetaMonto").value;
    if (!monto || parseFloat(monto) <= 0) return alert("Ingresa el monto");
    fetch("/venta-tarjeta", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ concepto, monto: parseFloat(monto) })
    }).then(() => navCorte(null, corteFecha));
  }

  function eliminarVentaTarjeta(id) {
    const pass = prompt("Contrasena para eliminar:");
    if (!pass) return;
    fetch("/venta-tarjeta/" + id, {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pass })
    }).then(res => {
      if (!res.ok) return alert("Contrasena incorrecta");
      navCorte(null, corteFecha);
    });
  }

  function filaCorte(label, valor, color, bold) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;' + (bold ? 'border-bottom:1px solid #eee;margin-bottom:4px;' : '') + '">' +
      '<span style="font-size:14px;color:#666;' + (bold ? 'font-weight:700;color:#1a1a1a;' : '') + '">' + label + '</span>' +
      '<span style="font-size:' + (bold ? '18' : '14') + 'px;font-weight:' + (bold ? '800' : '600') + ';color:' + color + ';">' + valor + '</span>' +
      '</div>';
  }

  function imprimirCorte() {
    window.print();
  }

  function descargarCorte() {
    window.open(llaveReportes("/corte/exportar/" + encodeURIComponent(corteFecha)), "_blank");
  }

  // Eliminados
  function navEliminados(btn) {
    setActiveNav(btn);
    tabActual = "eliminados";
    limpiarContenido();
    mostrarGraficas(false);
    mostrarMetricas(false);
    mostrarAcciones(false);

    const hoy = fechaHoyStr();
    setTitulo("Eliminados", hoy);

    fetch("/ventas/eliminados/" + encodeURIComponent(hoy))
      .then(res => res.json())
      .then(eliminados => {
        if (eliminados.length === 0) {
          contenedor.innerHTML = '<div class="sin-datos">No hay pedidos eliminados hoy</div>';
          return;
        }

        const totalElim = eliminados.reduce((a, p) => a + (p.total || 0), 0);

        let html = '<div style="background:#f8f8f8;border-radius:12px;padding:16px;margin-bottom:12px;">';
        html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
        html += '<span style="font-size:13px;color:#999;">' + eliminados.length + ' pedidos eliminados</span>';
        html += '<span style="font-size:18px;font-weight:700;color:#ef4444;">$' + totalElim.toLocaleString() + '</span>';
        html += '</div></div>';

        eliminados.forEach(p => {
          const prods = p.productos ? p.productos.map(pr => (pr.cantidad > 1 ? pr.cantidad + "x " : "") + pr.nombre).join(", ") : "";
          let card = '<div style="background:#f8f8f8;border-radius:8px;padding:12px 14px;margin-bottom:6px;border-left:4px solid #ef4444;">';
          card += '<div style="display:flex;justify-content:space-between;align-items:center;">';
          card += '<div style="flex:1;min-width:0;">';
          card += '<span style="font-size:14px;font-weight:700;text-transform:uppercase;">' + (p.cliente || "Sin nombre") + '</span>';
          if (p.metodoPago === "tarjeta") card += '<span class="badge-tarjeta">TARJETA</span>';
          card += '<div style="font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + prods + '</div>';
          card += '</div>';
          card += '<div style="text-align:right;flex-shrink:0;margin-left:10px;">';
          card += '<div style="font-size:15px;font-weight:700;color:#ef4444;">$' + (p.total || 0) + '</div>';
          card += '<div style="font-size:10px;color:#999;">' + (p.eliminadoEn || "") + '</div>';
          card += '</div></div></div>';
          contenedor.innerHTML += card;
        });
      });
  }

  // Referidos
  function eliminarReferido(codigo) {
    if (!confirm("Eliminar cupón " + codigo + "?")) return;
    fetch("/eliminar-referido/" + codigo, { method: "DELETE" })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          navReferidos();
        } else {
          alert(data.error || "Error al eliminar");
        }
      });
  }

  // ===== CLIENTES FRECUENTES =====
  function navClientes(btn) {
    setActiveNav(btn);
    tabActual = "clientes";
    limpiarContenido();
    mostrarGraficas(false);
    mostrarMetricas(false);
    mostrarAcciones(false);
    setTitulo("Clientes", "");

    contenedor.innerHTML = '<div class="sin-datos">Cargando...</div>';

    fetch("/clientes-frecuentes")
      .then(res => res.json())
      .then(data => {
        const clientes = data.clientes || [];
        if (clientes.length === 0) {
          contenedor.innerHTML = '<div class="sin-datos">Todavía no hay clientes con teléfono registrado</div>';
          return;
        }

        let html = '<div style="background:#f8f8f8;border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-around;text-align:center;">';
        html += '<div><div style="font-size:24px;font-weight:700;color:#333;">' + clientes.length + '</div><div style="font-size:11px;color:#999;">Clientes</div></div>';
        html += '<div><div style="font-size:24px;font-weight:700;color:#4caf50;">' + clientes.filter(c => c.pedidos > 1).length + '</div><div style="font-size:11px;color:#999;">Repitieron</div></div>';
        html += '<div><div style="font-size:24px;font-weight:700;color:#3b82f6;">$' + clientes.reduce((a, c) => a + c.total, 0).toLocaleString() + '</div><div style="font-size:11px;color:#999;">Han gastado</div></div>';
        html += '</div>';

        html += '<div style="font-size:12px;color:#999;margin-bottom:10px;">Ordenados por número de pedidos. Toca el botón verde para escribirle por WhatsApp.</div>';

        clientes.forEach(c => {
          const mensaje = encodeURIComponent("Hola " + c.nombre + ", te escribimos de La Cabaña. ");
          html += '<div style="background:#fff;border:1px solid #eee;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">';
          html += '<div style="min-width:0;flex:1;">';
          html += '<div style="font-size:15px;font-weight:700;">' + c.nombre + '</div>';
          html += '<div style="font-size:12px;color:#999;">' + c.telefono + ' · última vez ' + c.ultimaFecha + '</div>';
          html += '</div>';
          html += '<div style="text-align:right;font-variant-numeric:tabular-nums;">';
          html += '<div style="font-size:15px;font-weight:700;color:#4caf50;">$' + c.total.toLocaleString() + '</div>';
          html += '<div style="font-size:11px;color:#999;">' + c.pedidos + (c.pedidos === 1 ? ' pedido' : ' pedidos') + '</div>';
          html += '</div>';
          html += '<a href="https://wa.me/52' + c.telefono + '?text=' + mensaje + '" target="_blank" style="background:#25d366;color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;white-space:nowrap;">WhatsApp</a>';
          html += '</div>';
        });

        contenedor.innerHTML = html;
      })
      .catch(() => {
        contenedor.innerHTML = '<div class="sin-datos">No se pudieron cargar los clientes</div>';
      });
  }

  // ===== PRECIOS DEL MENU =====
  let _preciosFiltro = "";

  function navPrecios(btn) {
    setActiveNav(btn);
    tabActual = "precios";
    limpiarContenido();
    mostrarGraficas(false);
    mostrarMetricas(false);
    mostrarAcciones(false);
    setTitulo("Precios del Menú", "");
    pintarPrecios();
  }

  function pintarPrecios() {
    if (typeof MENU === "undefined") {
      contenedor.innerHTML = '<div class="sin-datos">No se pudo cargar el menú</div>';
      return;
    }

    const lista = MENU.listarPrecios({ notasSandwiches: [] });
    const filtro = _preciosFiltro.trim().toLowerCase();
    const visibles = filtro
      ? lista.filter(p => p.etiqueta.toLowerCase().includes(filtro))
      : lista;
    const editados = lista.filter(p => p.editado).length;

    let html = '<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:#1e40af;">';
    html += 'Cambia un precio y se aplica en caja y en los pedidos en línea. Las pantallas lo toman al recargarlas.';
    if (editados > 0) html += '<br><b>' + editados + '</b> precio' + (editados === 1 ? '' : 's') + ' con cambios. El botón <b>↺</b> regresa al original.';
    html += '</div>';

    html += '<input id="filtroPrecios" type="text" placeholder="Buscar producto..." value="' + _preciosFiltro.replace(/"/g, "&quot;") + '" ';
    html += 'style="width:100%;max-width:340px;padding:10px 12px;font-size:14px;border:1px solid #ddd;border-radius:8px;margin-bottom:14px;font-family:inherit;">';

    html += '<div style="font-size:12px;color:#999;margin-bottom:8px;">' + visibles.length + ' de ' + lista.length + ' productos</div>';

    visibles.forEach(p => {
      html += '<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #f0f0f0;">';
      html += '<div style="flex:1;min-width:0;font-size:14px;' + (p.editado ? 'font-weight:600;' : '') + '">' + p.etiqueta;
      if (p.editado) html += ' <span style="font-size:11px;color:#3b82f6;">(cambiado)</span>';
      html += '</div>';
      html += '<span style="color:#999;">$</span>';
      html += '<input type="number" min="0" step="1" value="' + p.precio + '" data-ruta="' + p.ruta.replace(/"/g, "&quot;") + '" ';
      html += 'onchange="guardarPrecio(this)" style="width:80px;padding:7px 8px;font-size:14px;border:1px solid #ddd;border-radius:8px;text-align:right;font-family:inherit;">';
      if (p.editado) {
        html += '<button onclick="restaurarPrecio(\'' + p.ruta.replace(/'/g, "\\'") + '\')" title="Regresar al precio original" ';
        html += 'style="background:#f3f4f6;border:1px solid #ddd;color:#666;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:14px;min-height:auto;padding:0;">↺</button>';
      } else {
        html += '<span style="width:32px;"></span>';
      }
      html += '</div>';
    });

    contenedor.innerHTML = html;

    const input = document.getElementById("filtroPrecios");
    input.oninput = () => { _preciosFiltro = input.value; };
    input.onkeyup = (e) => {
      if (e.key === "Enter" || _preciosFiltro !== input.value) return;
    };
    // Redibujar al dejar de escribir, conservando el foco
    let temporizador;
    input.addEventListener("input", () => {
      clearTimeout(temporizador);
      temporizador = setTimeout(() => {
        const pos = input.selectionStart;
        pintarPrecios();
        const nuevo = document.getElementById("filtroPrecios");
        nuevo.focus();
        nuevo.setSelectionRange(pos, pos);
      }, 350);
    });
  }

  window.guardarPrecio = function(input) {
    const ruta = input.dataset.ruta;
    const precio = parseFloat(input.value);
    if (isNaN(precio) || precio < 0) { alert("Precio inválido"); return; }

    input.disabled = true;
    fetch("/menu/precios", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ruta, precio })
    })
      .then(r => r.json())
      .then(d => {
        if (!d.ok) { alert("No se pudo guardar"); input.disabled = false; return; }
        MENU.usarPrecios(d.precios);
        pintarPrecios();
      })
      .catch(() => { alert("Error de conexión"); input.disabled = false; });
  };

  window.restaurarPrecio = function(ruta) {
    fetch("/menu/precios", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ruta, precio: null })
    })
      .then(r => r.json())
      .then(d => {
        if (!d.ok) return alert("No se pudo restaurar");
        MENU.usarPrecios(d.precios);
        pintarPrecios();
      })
      .catch(() => alert("Error de conexión"));
  };

  function navReferidos(btn) {
    setActiveNav(btn);
    tabActual = "referidos";
    limpiarContenido();
    mostrarGraficas(false);
    mostrarMetricas(false);
    mostrarAcciones(false);
    setTitulo("Cupones de Referidos", "");

    fetch("/referidos-status")
      .then(res => res.json())
      .then(data => {
        const refs = data.referidos || [];
        if (refs.length === 0) {
          contenedor.innerHTML = '<div class="sin-datos">No hay cupones de referido</div>';
          return;
        }

        const activos = refs.filter(r => !r.usado);
        const usados = refs.filter(r => r.usado);

        let html = '<div style="background:#f8f8f8;border-radius:12px;padding:16px;margin-bottom:12px;">';
        html += '<div style="display:flex;justify-content:space-around;text-align:center;">';
        html += '<div><div style="font-size:24px;font-weight:700;color:#4caf50;">' + activos.length + '</div><div style="font-size:11px;color:#999;">Activos</div></div>';
        html += '<div><div style="font-size:24px;font-weight:700;color:#ef4444;">' + usados.length + '</div><div style="font-size:11px;color:#999;">Usados</div></div>';
        html += '<div><div style="font-size:24px;font-weight:700;color:#333;">' + refs.length + '</div><div style="font-size:11px;color:#999;">Total</div></div>';
        html += '</div></div>';

        if (usados.length > 0) {
          html += '<div style="font-size:13px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;">Usados</div>';
          usados.forEach(r => {
            const fecha = r.fechaUso ? new Date(r.fechaUso).toLocaleDateString("es-MX", { day:"2-digit", month:"short", year:"numeric" }) : "";
            html += '<div style="background:#f8f8f8;border-radius:8px;padding:10px 14px;margin-bottom:6px;border-left:4px solid #ef4444;">';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
            html += '<div><span style="font-size:14px;font-weight:700;">' + r.codigo + '</span>';
            html += '<div style="font-size:12px;color:#999;">Usado por: ' + (r.usadoPor || "—") + '</div></div>';
            html += '<div style="display:flex;align-items:center;gap:6px;">';
            html += '<span style="font-size:11px;color:#999;">' + fecha + '</span>';
            html += '<button onclick="eliminarReferido(\'' + r.codigo + '\')" style="background:#ef4444;color:#fff;border:none;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;min-height:auto;">X</button>';
            html += '</div></div></div>';
          });
        }

        if (activos.length > 0) {
          html += '<div style="font-size:13px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px;">Activos</div>';
          activos.forEach(r => {
            const link = window.location.origin + "/cliente?ref=" + r.codigo;
            html += '<div style="background:#f8f8f8;border-radius:8px;padding:10px 14px;margin-bottom:6px;border-left:4px solid #4caf50;">';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
            html += '<div><span style="font-size:14px;font-weight:700;color:#4caf50;">' + r.codigo + '</span>';
            html += '<div style="font-size:11px;color:#999;word-break:break-all;">' + link + '</div></div>';
            html += '<div style="display:flex;align-items:center;gap:6px;">';
            html += '<button onclick="navigator.clipboard.writeText(\'' + link + '\');this.innerText=\'Copiado!\';setTimeout(()=>this.innerText=\'Copiar\',1500)" style="background:#4caf50;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;min-height:auto;">Copiar</button>';
            html += '<button onclick="eliminarReferido(\'' + r.codigo + '\')" style="background:#ef4444;color:#fff;border:none;padding:6px 8px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;min-height:auto;">X</button>';
            html += '</div></div></div>';
          });
        }

        contenedor.innerHTML = html;
      });
  }

  // Init
  cargarFechasYMostrar();

  // Real-time updates
  socket.on("pedidoEliminado", () => {
    if (tabActual === "dia" && fechaActual) cargarFecha(fechaActual);
    else if (tabActual === "semana") cargarSemanal();
    else if (tabActual === "mes") cargarMensual();
    else if (tabActual === "productos") cargarProductos();
  });
</script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>
