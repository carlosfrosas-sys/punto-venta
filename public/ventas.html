<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest-ventas.json">
  <link rel="apple-touch-icon" href="/icon-ventas.svg">
  <meta name="theme-color" content="#111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ventas">
  <title>Ventas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    /* Tabs de periodo */
    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .tabs button {
      padding: 10px 24px;
      font-size: 15px;
      border-radius: 20px;
      border: 1.5px solid #333;
      background: #1a1a1a;
      color: #888;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .tabs button:hover {
      border-color: #fbbf24;
      color: #fbbf24;
    }

    .tabs button.activo {
      background: #fbbf24;
      color: #111;
      border-color: #fbbf24;
      font-weight: 700;
    }

    .fechas {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .fechas button {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 20px;
      border: 1.5px solid #333;
      background: #1a1a1a;
      color: #888;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .fechas button:hover {
      border-color: #fbbf24;
      color: #fbbf24;
    }

    .fechas button.activo {
      background: #fbbf24;
      color: #111;
      border-color: #fbbf24;
      font-weight: 700;
    }

    .total-dia {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 20px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-left: 4px solid #fbbf24;
    }

    .total-dia .label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #888;
    }

    .total-dia .cantidad {
      font-size: 32px;
      font-weight: 700;
      color: #fbbf24;
    }

    /* Botones exportar */
    .acciones {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .acciones button {
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 10px;
      border: 1.5px solid #333;
      background: #1a1a1a;
      color: #888;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .acciones button:hover {
      border-color: #22c55e;
      color: #22c55e;
    }

    .contador {
      text-align: center;
      color: #555;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    /* Desglose por día */
    .desglose {
      margin-bottom: 20px;
    }

    .desglose-dia {
      background: #1a1a1a;
      border-radius: 8px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border-left: 3px solid #555;
    }

    .desglose-dia .dia-fecha {
      font-size: 14px;
      color: #aaa;
      font-weight: 500;
    }

    .desglose-dia .dia-total {
      font-size: 16px;
      font-weight: 700;
      color: #fbbf24;
    }

    .desglose-dia .dia-count {
      font-size: 12px;
      color: #666;
      margin-left: 10px;
    }

    #pedidos {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .pedido {
      background: #1a1a1a;
      border-left: 4px solid #22c55e;
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      max-width: 700px;
    }

    .pedido-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }

    .cliente {
      font-size: 20px;
      font-weight: 700;
      color: #22c55e;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .pedido-total {
      font-size: 18px;
      font-weight: 700;
      color: #fbbf24;
    }

    .hora {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    .nota-general {
      font-size: 14px;
      color: #fbbf24;
      font-weight: 600;
      margin-bottom: 10px;
      padding: 6px 10px;
      background: #2a2200;
      border-radius: 6px;
      border-left: 3px solid #fbbf24;
    }

    .productos {
      list-style: none;
    }

    .productos li {
      font-size: 18px;
      font-weight: 500;
      padding: 6px 0;
      border-bottom: 1px solid #222;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .productos li:last-child {
      border-bottom: none;
    }

    .precio {
      font-size: 14px;
      color: #888;
      font-weight: 400;
    }

    .nota {
      display: block;
      font-size: 14px;
      color: #f87171;
      font-weight: 600;
      margin-top: 2px;
    }

    .btn-eliminar {
      background: transparent;
      border: 1.5px solid #555;
      color: #555;
      padding: 6px 14px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .btn-eliminar:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    .sin-datos {
      text-align: center;
      color: #555;
      font-size: 16px;
      margin-top: 40px;
    }

    .tabla-productos {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .tabla-productos th {
      text-align: left;
      padding: 10px 12px;
      font-size: 13px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #333;
    }

    .tabla-productos td {
      padding: 10px 12px;
      font-size: 16px;
      border-bottom: 1px solid #222;
    }

    .tabla-productos tr:first-child td {
      color: #fbbf24;
      font-weight: 700;
    }

    .tabla-productos .col-rank {
      color: #555;
      width: 40px;
    }

    .tabla-productos .col-nombre {
      text-transform: uppercase;
    }

    .tabla-productos .col-cant {
      text-align: center;
      font-weight: 700;
      color: #22c55e;
    }

    .tabla-productos .col-total {
      text-align: right;
      color: #fbbf24;
    }

    @media (max-width: 768px) {
      .pedido {
        width: 100%;
      }

      .total-dia .cantidad {
        font-size: 26px;
      }

      .productos li {
        font-size: 16px;
        flex-direction: column;
      }

      .acciones {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>

<div id="loginOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#111;z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="text-align:center;width:280px;">
    <h2 style="font-size:20px;font-weight:300;letter-spacing:4px;text-transform:uppercase;color:#888;margin-bottom:24px;">Iniciar Sesión</h2>
    <input type="text" id="loginUsuario" placeholder="Usuario" style="width:100%;padding:12px;font-size:16px;border:1.5px solid #333;border-radius:8px;margin-bottom:10px;outline:none;font-family:inherit;background:#1a1a1a;color:#f5f5f5;">
    <input type="password" id="loginPassword" placeholder="Contraseña" style="width:100%;padding:12px;font-size:16px;border:1.5px solid #333;border-radius:8px;margin-bottom:10px;outline:none;font-family:inherit;background:#1a1a1a;color:#f5f5f5;" onkeydown="if(event.key==='Enter')hacerLogin()">
    <div id="loginError" style="color:#ef4444;font-size:14px;margin-bottom:10px;display:none;"></div>
    <button onclick="hacerLogin()" style="width:100%;padding:12px;font-size:16px;font-weight:600;background:#22c55e;color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;">Entrar</button>
  </div>
</div>

<script>
function hacerLogin() {
  const usuario = document.getElementById("loginUsuario").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errorDiv = document.getElementById("loginError");
  if (!usuario || !password) { errorDiv.innerText = "Completa ambos campos"; errorDiv.style.display = "block"; return; }
  fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ usuario, password }) })
    .then(r => r.json().then(d => ({ ok: r.ok, data: d })))
    .then(({ ok, data }) => {
      if (ok) { sessionStorage.setItem("token_admin", data.token); document.getElementById("loginOverlay").style.display = "none"; }
      else { errorDiv.innerText = data.error; errorDiv.style.display = "block"; }
    });
}
(function() {
  const token = sessionStorage.getItem("token_admin");
  if (token) {
    fetch("/verificar-token", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) })
      .then(r => { if (r.ok) document.getElementById("loginOverlay").style.display = "none"; });
  }
})();
</script>

  <h1>Ventas</h1>

  <!-- Tabs periodo -->
  <div class="tabs" id="tabs">
    <button class="activo" onclick="cambiarTab('dia')">Dia</button>
    <button onclick="cambiarTab('semana')">Semana</button>
    <button onclick="cambiarTab('mes')">Mes</button>
    <button onclick="cambiarTab('productos')">Productos</button>
  </div>

  <!-- Fechas (solo visible en tab dia) -->
  <div class="fechas" id="fechas"></div>

  <div class="total-dia">
    <span class="label" id="totalLabel">Total del dia</span>
    <span class="cantidad">$<span id="totalDia">0</span></span>
  </div>

  <div class="acciones">
    <button onclick="exportarExcel()">Exportar Excel</button>
    <button onclick="enviarCorreo()">Enviar por correo</button>
  </div>

  <div class="contador" id="contador">0 pedidos entregados</div>

  <div id="desglose" class="desglose"></div>

  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");
    const contFechas = document.getElementById("fechas");
    const contDesglose = document.getElementById("desglose");
    let fechaActual = "";
    let tabActual = "dia";

    function cambiarTab(tab) {
      tabActual = tab;

      // Marcar tab activo
      document.querySelectorAll(".tabs button").forEach((btn, i) => {
        const tabs = ["dia", "semana", "mes", "productos"];
        btn.classList.toggle("activo", tabs[i] === tab);
      });

      // Mostrar/ocultar secciones según tab
      const totalDiaDiv = document.querySelector(".total-dia");
      const accionesDiv = document.querySelector(".acciones");
      const contadorDiv = document.getElementById("contador");

      if (tab === "productos") {
        contFechas.style.display = "none";
        totalDiaDiv.style.display = "none";
        accionesDiv.style.display = "none";
        contadorDiv.style.display = "none";
        contDesglose.innerHTML = "";
        cargarProductos();
      } else {
        totalDiaDiv.style.display = "flex";
        accionesDiv.style.display = "flex";
        contadorDiv.style.display = "block";

        if (tab === "dia") {
          document.getElementById("totalLabel").innerText = "Total del dia";
          contFechas.style.display = "flex";
          contDesglose.innerHTML = "";
          cargarFechas();
        } else if (tab === "semana") {
          document.getElementById("totalLabel").innerText = "Total semanal";
          contFechas.style.display = "none";
          cargarSemanal();
        } else if (tab === "mes") {
          document.getElementById("totalLabel").innerText = "Total mensual";
          contFechas.style.display = "none";
          cargarMensual();
        }
      }
    }

    function actualizarTotal(total, cantidad) {
      document.getElementById("totalDia").innerText = total;
      document.getElementById("contador").innerText = cantidad + " pedido" + (cantidad !== 1 ? "s" : "") + " entregado" + (cantidad !== 1 ? "s" : "");
    }

    function mostrarPedido(pedido) {
      const div = document.createElement("div");
      div.className = "pedido";

      div.innerHTML = `
        <div class="pedido-header">
          <div>
            <div class="cliente">${pedido.cliente}</div>
            ${pedido.nota ? `<div class="nota-general">${pedido.nota}</div>` : ""}
          </div>
          <div style="text-align:right;">
            <div class="pedido-total">$${pedido.total}</div>
            ${pedido.horaEntrega ? `<div class="hora">${pedido.horaEntrega}</div>` : ""}
            <button class="btn-eliminar" onclick="eliminarPedido(${pedido.id})">Eliminar</button>
          </div>
        </div>
        <ul class="productos">
          ${pedido.productos.map(p =>
            `<li>
              <div>
                ${p.nombre}
                ${p.nota ? `<span class="nota">${p.nota}</span>` : ""}
              </div>
              <span class="precio">$${p.precio}</span>
            </li>`
          ).join("")}
        </ul>
      `;

      contenedor.prepend(div);
    }

    function eliminarPedido(id) {
      const pass = prompt("Ingresa la contraseña para eliminar:");
      if (!pass) return;

      fetch("/pedido/" + id, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pass })
      })
        .then(res => {
          if (res.ok) {
            cambiarTab(tabActual);
          } else {
            alert("Contraseña incorrecta");
          }
        });
    }

    function mostrarDesglose(porDia) {
      contDesglose.innerHTML = "";
      const fechas = Object.keys(porDia).sort((a, b) => {
        const [da, ma, ya] = a.split("/");
        const [db, mb, yb] = b.split("/");
        return new Date(yb, mb-1, db) - new Date(ya, ma-1, da);
      });

      fechas.forEach(fecha => {
        const info = porDia[fecha];
        const div = document.createElement("div");
        div.className = "desglose-dia";
        div.innerHTML = `
          <span class="dia-fecha">${fecha}</span>
          <span>
            <span class="dia-total">$${info.total}</span>
            <span class="dia-count">${info.pedidos.length} pedido${info.pedidos.length !== 1 ? "s" : ""}</span>
          </span>
        `;
        contDesglose.appendChild(div);
      });
    }

    function cargarFecha(fecha) {
      fechaActual = fecha;
      contenedor.innerHTML = "";
      contDesglose.innerHTML = "";

      // Marcar boton activo
      document.querySelectorAll(".fechas button").forEach(btn => {
        btn.classList.toggle("activo", btn.dataset.fecha === fecha);
      });

      fetch("/ventas/fecha/" + encodeURIComponent(fecha))
        .then(res => res.json())
        .then(data => {
          if (data.pedidos.length === 0) {
            contenedor.innerHTML = '<div class="sin-datos">No hay ventas en esta fecha</div>';
          } else {
            data.pedidos.forEach(mostrarPedido);
          }
          actualizarTotal(data.total, data.pedidos.length);
        });
    }

    function cargarFechas() {
      fetch("/ventas/fechas")
        .then(res => res.json())
        .then(fechas => {
          contFechas.innerHTML = "";

          if (fechas.length === 0) {
            fetch("/pedidos")
              .then(res => res.json())
              .then(pedidos => {
                const entregados = pedidos.filter(p => p.estado === "Entregado");
                entregados.forEach(mostrarPedido);
                const total = entregados.reduce((acc, p) => acc + p.total, 0);
                actualizarTotal(total, entregados.length);
              });
            return;
          }

          fechas.forEach(fecha => {
            const btn = document.createElement("button");
            btn.innerText = fecha;
            btn.dataset.fecha = fecha;
            btn.onclick = () => cargarFecha(fecha);
            contFechas.appendChild(btn);
          });

          // Cargar la fecha mas reciente por defecto
          cargarFecha(fechas[fechas.length - 1]);
        });
    }

    function cargarSemanal() {
      contenedor.innerHTML = "";
      contDesglose.innerHTML = "";

      fetch("/ventas/semanal")
        .then(res => res.json())
        .then(data => {
          actualizarTotal(data.total, data.pedidos.length);
          if (data.porDia) mostrarDesglose(data.porDia);
          if (data.pedidos.length === 0) {
            contenedor.innerHTML = '<div class="sin-datos">No hay ventas esta semana</div>';
          } else {
            data.pedidos.forEach(mostrarPedido);
          }
        });
    }

    function cargarMensual() {
      contenedor.innerHTML = "";
      contDesglose.innerHTML = "";

      fetch("/ventas/mensual")
        .then(res => res.json())
        .then(data => {
          actualizarTotal(data.total, data.pedidos.length);
          if (data.porDia) mostrarDesglose(data.porDia);
          if (data.pedidos.length === 0) {
            contenedor.innerHTML = '<div class="sin-datos">No hay ventas este mes</div>';
          } else {
            data.pedidos.forEach(mostrarPedido);
          }
        });
    }

    let periodoProductos = "dia";

    function cargarProductos() {
      contenedor.innerHTML = "";
      contDesglose.innerHTML = "";

      // Selector de periodo para productos
      const hoy = new Date().toLocaleDateString("es-MX", { timeZone: "America/Mexico_City", year: "numeric", month: "2-digit", day: "2-digit" });

      const selectorDiv = document.createElement("div");
      selectorDiv.className = "fechas";
      selectorDiv.style.display = "flex";
      ["dia", "semana", "mes"].forEach(p => {
        const btn = document.createElement("button");
        btn.innerText = p === "dia" ? "Hoy" : p === "semana" ? "Semana" : "Mes";
        if (p === periodoProductos) btn.classList.add("activo");
        btn.onclick = () => {
          periodoProductos = p;
          cargarProductos();
        };
        selectorDiv.appendChild(btn);
      });
      contDesglose.appendChild(selectorDiv);

      let url = "/ventas/productos-vendidos?periodo=" + periodoProductos;
      if (periodoProductos === "dia") url += "&fecha=" + encodeURIComponent(hoy);

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.productos.length === 0) {
            contenedor.innerHTML = '<div class="sin-datos">No hay productos vendidos</div>';
            return;
          }

          let html = '';

          // Categorías resumen
          html += '<div style="margin-bottom:20px;"><h3 style="color:#888;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;">Por Categoría</h3>';
          html += '<table class="tabla-productos"><thead><tr><th>Categoría</th><th style="text-align:center">Cant.</th><th style="text-align:right">Total</th></tr></thead><tbody>';
          data.categorias.forEach(c => {
            html += `<tr><td class="col-nombre">${c.nombre}</td><td class="col-cant">${c.cantidad}</td><td class="col-total">$${c.total}</td></tr>`;
          });
          html += '</tbody></table></div>';

          // Por día (solo si semana/mes con múltiples días)
          if (data.porDia && data.porDia.length > 1) {
            data.porDia.forEach(dia => {
              html += `<div style="margin-bottom:20px;border:1px solid #333;border-radius:10px;padding:14px;">`;
              html += `<h3 style="color:#fbbf24;font-size:15px;margin-bottom:10px;">${dia.fecha}</h3>`;

              // Categorías del día
              html += '<table class="tabla-productos" style="margin-bottom:10px;"><thead><tr><th>Categoría</th><th style="text-align:center">Cant.</th><th style="text-align:right">Total</th></tr></thead><tbody>';
              dia.categorias.forEach(c => {
                html += `<tr><td class="col-nombre">${c.nombre}</td><td class="col-cant">${c.cantidad}</td><td class="col-total">$${c.total}</td></tr>`;
              });
              html += '</tbody></table>';

              // Productos del día
              html += '<table class="tabla-productos"><thead><tr><th>#</th><th>Producto</th><th style="text-align:center">Cant.</th><th style="text-align:right">Total</th></tr></thead><tbody>';
              dia.productos.forEach((p, i) => {
                html += `<tr><td class="col-rank">${i + 1}</td><td class="col-nombre">${p.nombre}</td><td class="col-cant">${p.cantidad}</td><td class="col-total">$${p.total}</td></tr>`;
              });
              html += '</tbody></table></div>';
            });
          } else {
            // Un solo día: solo tabla de productos
            html += '<div style="margin-bottom:20px;"><h3 style="color:#888;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;">Productos</h3>';
            html += '<table class="tabla-productos"><thead><tr><th>#</th><th>Producto</th><th style="text-align:center">Cant.</th><th style="text-align:right">Total</th></tr></thead><tbody>';
            data.productos.forEach((p, i) => {
              html += `<tr><td class="col-rank">${i + 1}</td><td class="col-nombre">${p.nombre}</td><td class="col-cant">${p.cantidad}</td><td class="col-total">$${p.total}</td></tr>`;
            });
            html += '</tbody></table></div>';
          }

          contenedor.innerHTML = html;
        });
    }

    function exportarExcel() {
      let url;
      if (tabActual === "dia") {
        if (!fechaActual) return;
        url = "/ventas/exportar/dia?fecha=" + encodeURIComponent(fechaActual);
      } else if (tabActual === "semana") {
        url = "/ventas/exportar/semana";
      } else {
        url = "/ventas/exportar/mes";
      }
      window.open(url, "_blank");
    }

    function enviarCorreo() {
      let url;
      if (tabActual === "dia") {
        if (!fechaActual) return;
        url = window.location.origin + "/ventas/exportar/dia?fecha=" + encodeURIComponent(fechaActual);
      } else if (tabActual === "semana") {
        url = window.location.origin + "/ventas/exportar/semana";
      } else {
        url = window.location.origin + "/ventas/exportar/mes";
      }

      const totalTxt = document.getElementById("totalDia").innerText;
      const asunto = encodeURIComponent("Ventas - " + tabActual + " - $" + totalTxt);
      const cuerpo = encodeURIComponent("Descarga el reporte de ventas aqui:\n" + url);
      window.open("mailto:?subject=" + asunto + "&body=" + cuerpo);
    }

    // Iniciar con tab dia
    cargarFechas();

    // Actualizar en tiempo real
    socket.on("pedidoEliminado", () => {
      cambiarTab(tabActual);
    });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
