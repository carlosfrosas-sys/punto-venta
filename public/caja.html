  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 25px;
    color: #333;
  }

  h1 {
    text-align: center;
    font-size: 40px;
    margin-bottom: 10px;
    color: #1f2937;
  }

  h2 {
    margin-top: 30px;
    margin-bottom: 10px;
    color: #374151;
  }

  h3 {
    margin-top: 20px;
    margin-bottom: 5px;
    color: #4b5563;
  }

  /* 🔹 Contenedor categorías */
  #categorias {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }

  /* 🔹 Contenedor opciones */
  #proteinas {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
  }

  /* 🔥 Botones generales */
  button {
    padding: 12px 18px;
    font-size: 15px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: 0.2s ease;
    font-weight: 600;
  }

  /* Categorías */
  #categorias button {
    background: #2563eb;
    color: white;
  }

  #categorias button:hover {
    background: #1d4ed8;
  }

  /* Opciones de productos */
  #proteinas button {
    background: #e5e7eb;
    color: #111827;
  }

  #proteinas button:hover {
    background: #d1d5db;
  }

  /* Botón enviar */
  button[onclick="enviarPedido()"] {
    background: #16a34a;
    color: white;
    font-size: 18px;
    padding: 14px 25px;
    margin-top: 15px;
  }

  button[onclick="enviarPedido()"]:hover {
    background: #15803d;
  }

  /* Lista pedido */
  #lista {
    list-style: none;
    padding: 0;
  }

  #lista li {
    background: white;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.05);
  }

  #lista small {
    color: #dc2626;
    font-weight: bold;
  }

  /* Botón eliminar */
  #lista button {
    background: #ef4444;
    color: white;
    margin-left: 10px;
    padding: 6px 10px;
    font-size: 14px;
  }

  #lista button:hover {
    background: #dc2626;
  }

  /* Input cliente */
  input {
    width: 100%;
    max-width: 400px;
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    margin-bottom: 15px;
  }

  input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37,99,235,0.2);
  }

  /* Total */
  #total {
    font-size: 24px;
    font-weight: bold;
    color: #111827;
  }
</style>
</head>

function cargarCategorias() {
  const cont = document.getElementById("categorias");

  for (let categoria in menu) {
    const btn = document.createElement("button");
    btn.innerText = categoria;
    btn.onclick = () => mostrarOpciones(categoria);
    cont.appendChild(btn);
  }
}

function mostrarOpciones(categoria) {

  const cont = document.getElementById("proteinas");
  cont.innerHTML = "";

  const datos = menu[categoria];

  if (!datos) {
    cont.innerHTML = "<p>No hay datos en esta categoría</p>";
    return;
  }

  // 🥤 LICUADOS (manejo especial mejorado)
if (categoria === "Licuados") {

  cont.innerHTML = "<h3>Elige sabor:</h3>";

  datos.sabores.forEach(sabor => {

    const btn = document.createElement("button");
    btn.innerText = sabor + " - $" + datos.precio;

    btn.onclick = () => {

      // Si el sabor ya es Avena, no preguntamos extra
      if (sabor === "Avena") {
        agregarProducto("Licuado de Avena", datos.precio);
        return;
      }

      const conAvena = confirm("¿Agregar avena? +$4");

      let precioFinal = datos.precio;
      let nombreFinal = "Licuado de " + sabor;

      if (conAvena) {
        precioFinal += 4;
        nombreFinal += " con avena";
      }

      agregarProducto(nombreFinal, precioFinal);
    };

    cont.appendChild(btn);
  });

  return;
}

  // 🌮 SUBCATEGORÍAS (Antojitos)
  if (datos.subcategorias) {

    for (let sub in datos.subcategorias) {

      const btn = document.createElement("button");
      btn.innerText = sub;
      btn.onclick = () => mostrarSubcategoria(categoria, sub);
      cont.appendChild(btn);
    }

    return;
  }

  // 🔥 SI TIENE OPCIÓN SENCILLO
  if (datos.sencillo) {

    const btnSencillo = document.createElement("button");
    btnSencillo.innerText = "Sencillos - $" + datos.sencillo;
    btnSencillo.onclick = () =>
      agregarProducto(categoria + " Sencillos", datos.sencillo);

    cont.appendChild(btnSencillo);
  }

  // 🔥 PROTEÍNAS
  if (datos.proteinas) {

    datos.proteinas.forEach(p => {

      const btn = document.createElement("button");

      if (typeof p === "object") {
        btn.innerText = p.nombre + " - $" + p.precio;
        btn.onclick = () =>
          agregarProducto(categoria + " de " + p.nombre, p.precio);
      } else {
        btn.innerText = p + " - $" + datos.precio;
        btn.onclick = () =>
          agregarProducto(categoria + " de " + p, datos.precio);
      }

      cont.appendChild(btn);
    });
  }

  // 📦 ITEMS
  if (datos.items) {

    datos.items.forEach(item => {

      const btn = document.createElement("button");
      btn.innerText = item.nombre + " - $" + item.precio;
      btn.onclick = () => agregarProducto(item.nombre, item.precio);

      cont.appendChild(btn);
    });
  }

  // 🥤 AGUAS
  if (datos.sabores && categoria !== "Licuados") {

    datos.sabores.forEach(sabor => {

      const btn = document.createElement("button");
      btn.innerText = sabor;
      btn.onclick = () => mostrarTamañosAgua(sabor);

      cont.appendChild(btn);
    });
  }
}
function mostrarSubcategoria(categoria, sub) {

  const cont = document.getElementById("proteinas");
  cont.innerHTML = "<h3>Elige proteína:</h3>";

  const datos = menu[categoria].subcategorias[sub];

  datos.proteinas.forEach(p => {

    const btn = document.createElement("button");

    if (typeof p === "object") {

      btn.innerText = p.nombre + " - $" + p.precio;
      btn.onclick = () => {
        agregarProducto(sub + " de " + p.nombre, p.precio);
      };

    } else {

      btn.innerText = p + " - $" + datos.precio;
      btn.onclick = () => {
        agregarProducto(sub + " de " + p, datos.precio);
      };

    }

    cont.appendChild(btn);

  });
}
function mostrarTamañosAgua(sabor) {
const cont = document.getElementById("proteinas");
  cont.innerHTML = "<h3>Elige tamaño:</h3>";

  const tamaños = menu["Aguas"].tamaños;

  for (let tamaño in tamaños) {
    const precio = tamaños[tamaño];

    const btn = document.createElement("button");
    btn.innerText = tamaño + " - $" + precio;

    btn.onclick = () => {
      const extra = confirm("¿Agregar Chía o Avena +$4?");
      let precioFinal = precio;
      let nombreFinal = "Agua de " + sabor + " " + tamaño;

      if (extra) {
        precioFinal += menu["Aguas"].extra;
        nombreFinal += " con Chía/Avena";
      }

      agregarProducto(nombreFinal, precioFinal);
    };

    cont.appendChild(btn);
  }
}
function agregarProducto(nombre, precio) {

  const nota = prompt("¿Alguna indicación especial?\n(Ej: sin cebolla)");

  productos.push({ 
    nombre, 
    precio,
    nota: nota ? nota : ""
  });

  total += precio;

  renderizarLista();
}
function renderizarLista() {

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  productos.forEach((prod, index) => {

    const li = document.createElement("li");

    li.innerHTML = `
      <strong>${prod.nombre}</strong> - $${prod.precio}
      ${prod.nota ? `<br><small>📝 ${prod.nota}</small>` : ""}
      <button onclick="eliminarProducto(${index})">❌</button>
    `;

    lista.appendChild(li);
  });

  document.getElementById("total").innerText = total;
}
function eliminarProducto(index) {

  total -= productos[index].precio;

  productos.splice(index, 1);

  renderizarLista();
}

function enviarPedido() {

  if (productos.length === 0) return;

  const nombreCliente = document.getElementById("cliente").value.trim();

  if (!nombreCliente) {
    alert("Escribe el nombre del cliente");
    return;
  }

  fetch("/pedido", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      cliente: nombreCliente,
      productos,
      total
    })
  });

  // Reset
  productos = [];
  total = 0;

  document.getElementById("lista").innerHTML = "";
  document.getElementById("total").innerText = "0";
  document.getElementById("proteinas").innerHTML = "";
  document.getElementById("cliente").value = "";

  alert("Pedido enviado");
}
