<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Barra</title>
  <link rel="manifest" href="/manifest-barra.json">
  <link rel="apple-touch-icon" href="/icon-barra.png">
  <meta name="theme-color" content="#111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Barra">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 8px 12px;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 15px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    #pedidos {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: calc(100vh - 16px);
      overflow-y: auto;
    }

    .pedido {
      background: #1a1a1a;
      border: 2px solid #60a5fa;
      border-radius: 8px;
      padding: 6px 12px;
      width: 100%;
    }

    .pedido-body {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .productos {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .productos li {
      font-size: 48px;
      font-weight: 600;
      padding: 2px 0;
      text-transform: uppercase;
    }

    .punto {
      color: #60a5fa;
      margin-right: 8px;
    }

    .qty {
      color: #ef4444;
      font-weight: 800;
    }

    .nota {
      display: inline;
      font-size: 28px;
      color: #f87171;
      font-weight: 600;
      margin-left: 8px;
    }

    .pedido-lado {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
      margin-left: 20px;
    }

    .nota-general {
      display: inline;
      font-size: 28px;
      color: #fbbf24;
      font-weight: 600;
      margin-left: 8px;
    }

    .para-llevar {
      font-size: 20px;
      color: #f97316;
      font-weight: 700;
      text-transform: uppercase;
    }

    .pedido {
      position: relative;
    }

    .pedido-meta {
      position: absolute;
      right: 12px;
      bottom: 6px;
      display: flex;
      gap: 12px;
      font-size: 18px;
      color: #666;
      margin: 0;
    }

    .pedido-meta .hora-envio {
      color: #60a5fa;
    }

    .pedido-meta .tiempo {
      color: #f87171;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div id="loadingOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#faf8f5;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 0.5s ease;">
  <style>#loadingSpinner{width:36px;height:36px;border:3px solid #e8e4df;border-top:3px solid #c0785a;border-radius:50%;animation:lcSpin 0.8s linear infinite;margin-top:18px;}@keyframes lcSpin{to{transform:rotate(360deg)}}</style>
  <div style="font-size:24px;font-weight:300;letter-spacing:4px;text-transform:uppercase;color:#6b5b4f;font-family:'Segoe UI',Arial,sans-serif;">La Cabaña</div>
  <div style="font-size:14px;color:#c0785a;margin-top:10px;font-family:'Segoe UI',Arial,sans-serif;">Cargando sistema...</div>
  <div id="loadingSpinner"></div>
</div>

  <div id="activar-sonido" onclick="activarSonido()" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:999;cursor:pointer;">
    <div style="text-align:center;">
      <div style="font-size:60px;margin-bottom:20px;">🔊</div>
      <div style="font-size:24px;color:#60a5fa;font-weight:600;">Tocar para activar sonido</div>
    </div>
  </div>
  <div id="pedidos"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const contenedor = document.getElementById("pedidos");
    const pedidosMostrados = new Set();

    // Sonido de notificación con AudioContext (beep real)
    let audioCtx;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function beep(ctx) {
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.frequency.value = 880;
      osc1.type = "sine";
      gain1.gain.setValueAtTime(0.6, ctx.currentTime);
      gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
      osc1.start(ctx.currentTime);
      osc1.stop(ctx.currentTime + 0.15);
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.frequency.value = 1200;
      osc2.type = "sine";
      gain2.gain.setValueAtTime(0.6, ctx.currentTime + 0.18);
      gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
      osc2.start(ctx.currentTime + 0.18);
      osc2.stop(ctx.currentTime + 0.35);
    }

    function playNotification() {
      try {
        const ctx = getAudioCtx();
        if (ctx.state === "suspended") {
          ctx.resume().then(() => beep(ctx));
        } else {
          beep(ctx);
        }
      } catch(e) {}
    }

    // Desbloquear audio en cualquier interacción
    function unlockAudio() {
      const ctx = getAudioCtx();
      if (ctx.state === "running") return;
      ctx.resume().then(() => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.value = 0;
        osc.start();
        osc.stop(ctx.currentTime + 0.01);
      });
    }

    ["click", "touchstart", "keydown"].forEach(evt => {
      document.addEventListener(evt, unlockAudio, { once: true });
    });

    try { getAudioCtx().resume(); } catch(e) {}

    function activarSonido() {
      const ctx = getAudioCtx();
      ctx.resume().then(() => {
        beep(ctx);
        document.getElementById("activar-sonido").style.display = "none";
      });
    }

    // Calcular minutos transcurridos
    function calcularMinutos(horaEnvio) {
      if (!horaEnvio) return 0;
      const ahora = new Date();
      const partes = horaEnvio.match(/(\d+):(\d+)/);
      if (!partes) return 0;
      let h = parseInt(partes[1]);
      const m = parseInt(partes[2]);
      const esPM = /p\.?\s*m\.?/i.test(horaEnvio);
      const esAM = /a\.?\s*m\.?/i.test(horaEnvio);
      if (esPM && h < 12) h += 12;
      if (esAM && h === 12) h = 0;
      const envio = new Date();
      envio.setHours(h, m, 0, 0);
      return Math.floor((ahora - envio) / 60000);
    }

    function tiempoTranscurrido(horaEnvio) {
      const diff = calcularMinutos(horaEnvio);
      if (diff < 1) return "ahora";
      if (diff < 60) return "hace " + diff + " min";
      return "hace " + Math.floor(diff / 60) + "h " + (diff % 60) + "m";
    }

    function colorPrioridad(min) {
      if (min >= 12) return "#ef4444";
      if (min >= 8) return "#fbbf24";
      return "#60a5fa";
    }

    function actualizarTiempos() {
      document.querySelectorAll(".pedido").forEach(el => {
        const tiempoEl = el.querySelector(".tiempo");
        if (!tiempoEl) return;
        const hora = tiempoEl.dataset.hora;
        if (!hora) return;
        tiempoEl.innerText = tiempoTranscurrido(hora);
        const min = calcularMinutos(hora);
        el.style.borderColor = colorPrioridad(min);
      });
    }

    setInterval(actualizarTiempos, 1000);

    function cargarPedidos() {
      contenedor.innerHTML = "";
      pedidosMostrados.clear();
      fetch("/pedidos")
        .then(res => res.json())
        .then(pedidos => {
          pedidos.filter(p => p.estado === "pendiente").forEach(mostrarPedido);
        });
    }

    // Ocultar overlay de carga
    function ocultarLoadingOverlay(){var o=document.getElementById("loadingOverlay");if(o){o.style.opacity="0";setTimeout(function(){o.remove();},500);}}

    // Cargar al inicio
    cargarPedidos();
    ocultarLoadingOverlay();

    // Polling cada 15s: agrega nuevos pedidos y sincroniza productos entregados
    setInterval(sincronizar, 15000);

    function sincronizar() {
      fetch("/pedidos")
        .then(res => res.json())
        .then(pedidos => {
          const pendientes = pedidos.filter(p => p.estado === "pendiente");
          const idsPendientes = new Set(pendientes.map(p => p.id));

          // Remover pedidos que ya no están pendientes
          Array.from(pedidosMostrados).forEach(id => {
            if (!idsPendientes.has(id)) {
              const el = document.getElementById("pedido-" + id);
              if (el) el.remove();
              pedidosMostrados.delete(id);
            }
          });

          // Sincronizar o agregar
          pendientes.forEach(p => {
            if (!pedidosMostrados.has(p.id)) {
              mostrarPedido(p);
              return;
            }
            const el = document.getElementById("pedido-" + p.id);
            if (!el) return;
            (p.productosEntregados || []).forEach(index => {
              const li = el.querySelector(`li[data-index="${index}"]`);
              if (li) li.remove();
            });
            if (el.querySelectorAll(".productos li").length === 0) {
              el.remove();
              pedidosMostrados.delete(p.id);
            }
          });
        });
    }

    // Recargar al reconectar (siempre, para no perder pedidos)
    socket.on("connect", () => {
      cargarPedidos();
    });

    // Al despertar la tablet o volver a la pestaña, sincronizar de inmediato
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) sincronizar();
    });

    socket.on("nuevoPedido", (pedido) => {
      if (!pedidosMostrados.has(pedido.id)) {
        playNotification();
        mostrarPedido(pedido);
      }
    });

    socket.on("actualizarPedido", (pedido) => {
      if (pedido.estado !== "pendiente") {
        const el = document.getElementById("pedido-" + pedido.id);
        if (el) el.remove();
        pedidosMostrados.delete(pedido.id);
      }
    });

    socket.on("pedidoEliminado", (id) => {
      const el = document.getElementById("pedido-" + id);
      if (el) el.remove();
      pedidosMostrados.delete(id);
    });

    socket.on("productoEntregado", ({ pedidoId, index }) => {
      const el = document.getElementById("pedido-" + pedidoId);
      if (!el) return;
      const li = el.querySelector(`li[data-index="${index}"]`);
      if (li) li.remove();

      const restantes = el.querySelectorAll(".productos li");
      if (restantes.length === 0) {
        el.remove();
        pedidosMostrados.delete(pedidoId);
      }
    });

    socket.on("productoRegresado", ({ pedidoId, index }) => {
      fetch("/pedidos")
        .then(res => res.json())
        .then(pedidos => {
          const pedido = pedidos.find(p => p.id === pedidoId && p.estado === "pendiente");
          if (!pedido) return;
          const el = document.getElementById("pedido-" + pedidoId);
          if (el) {
            el.remove();
            pedidosMostrados.delete(pedidoId);
          }
          mostrarPedido(pedido);
        });
    });

    socket.on("pedidoRegresado", (pedido) => {
      if (!pedidosMostrados.has(pedido.id)) {
        playNotification();
        mostrarPedido(pedido);
      }
    });

    // Productos de barra: bebidas, aguas, licuados, café, ensaladas, snacks, tacos dorados, económico
    const prefBebidas = ["Agua ", "Licuado de ", "Licuado Litro", "Café ", "Capuccino", "Espumoso", "Té", "Yakult", "Peñafielita", "Boing", "Del Valle", "Bonafont", "Santa Clara", "Refresco de Sabor", "Fuze Tea", "Arizona", "Jumex", "Coca", "Volt", "Electrolit", "Gatorade", "Monster", "Redbull", "Agua Caliente"];
    const snacks = ["Hot Dog", "2 Hot Dogs", "Banderilla", "Papas a la Francesa", "Nachos", "Maruchan"];
    const bebidasPaquete = ["Té", "Café", "Jugo"];

    function esDeBarra(nombre) {
      if (prefBebidas.some(b => nombre.startsWith(b))) return true;
      if (nombre.startsWith("Ensalada")) return true;
      if (snacks.some(s => nombre.startsWith(s))) return true;
      if (nombre.startsWith("Paleta")) return true;
      if (nombre.startsWith("Económico")) return true;
      if (nombre === "Tacos Dorados" || nombre === "1pza de Taco Dorado") return true;
      if (nombre.startsWith("Hot Cakes") || nombre.startsWith("HotCakes") || nombre.startsWith("Paquete 4")) return true;
      if (nombre === "Corn Flakes") return true;
      return false;
    }

    function esPaqueteConBebida(p) {
      if (!p.nombre.startsWith("Paquete") || !p.nota) return false;
      // Paquete 4 ya sale completo en barra, no crear virtual
      if (p.nombre.startsWith("Paquete 4")) return false;
      return bebidasPaquete.some(b => p.nota.includes(b));
    }

    function extraerBebidaPaquete(nota) {
      for (const b of bebidasPaquete) {
        if (nota.includes(b)) return b;
      }
      return "";
    }

    function mostrarPedido(pedido) {
      if (pedidosMostrados.has(pedido.id)) return;
      pedidosMostrados.add(pedido.id);

      const entregados = pedido.productosEntregados || [];
      // Productos directos de barra
      let productosBarra = pedido.productos
        .map((p, i) => ({ ...p, _index: i }))
        .filter(p => !entregados.includes(p._index) && esDeBarra(p.nombre));

      // Bebidas de paquetes (Té, Café, Jugo) → mostrar como "Café de Paquete"
      pedido.productos.forEach((p, i) => {
        if (entregados.includes(i)) return;
        if (esPaqueteConBebida(p)) {
          const bebida = extraerBebidaPaquete(p.nota);
          if (bebida) {
            productosBarra.push({ nombre: bebida + " de Paquete", _index: i, _virtual: true });
          }
        }
      });

      if (productosBarra.length === 0) return;

      const hora = pedido.horaEnvio || new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });

      const div = document.createElement("div");
      div.id = "pedido-" + pedido.id;
      div.className = "pedido";
      div.style.borderColor = colorPrioridad(calcularMinutos(hora));

      div.innerHTML = `
        <div class="pedido-body">
          <ul class="productos">
            ${productosBarra.map((p, idx) =>
              `<li data-index="${p._index}">
                <span class="punto">&#8226;</span> ${p.cantidad && p.cantidad > 1 ? `<span class="qty">${p.cantidad}</span> ` : ""}${p.nombre}
                ${p.nota && !p._virtual ? `<span class="nota">${p.nota.replace(/\s*\+\$\d+/g, "")}</span>` : ""}
                ${idx === productosBarra.length - 1 && pedido.nota ? `<span class="nota-general">${pedido.nota}</span>` : ""}
              </li>`
            ).join("")}
          </ul>
        </div>
        <div class="pedido-meta">
          ${pedido.paraLlevar ? `<span class="para-llevar">Para llevar</span>` : ""}
          <span class="hora-envio">${hora}</span>
          <span class="tiempo" data-hora="${hora}">${tiempoTranscurrido(hora)}</span>
        </div>
      `;

      // Insertar ordenado: más antiguo arriba
      const minutos = calcularMinutos(hora);
      let insertado = false;
      for (const hijo of contenedor.children) {
        const tiempoHijo = hijo.querySelector(".tiempo");
        if (tiempoHijo) {
          const minHijo = calcularMinutos(tiempoHijo.dataset.hora);
          if (minutos > minHijo) {
            contenedor.insertBefore(div, hijo);
            insertado = true;
            break;
          }
        }
      }
      if (!insertado) contenedor.appendChild(div);
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
