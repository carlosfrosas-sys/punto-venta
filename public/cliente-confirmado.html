<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#009ee3">
  <title>Pedido Confirmado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f7fb;
      color: #3d3d3d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      color: #009ee3;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      background: #009ee3;
      color: #fff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
    }
    a:hover {
      background: #007bb5;
    }
    .ref-box {
      background: #e8f5e9;
      border: 2px solid #4caf50;
      border-radius: 12px;
      padding: 16px;
      margin: 20px 0;
      text-align: center;
    }
    .ref-box p {
      font-size: 14px;
      color: #2e7d32;
      margin-bottom: 10px;
    }
    .ref-link {
      font-size: 13px;
      color: #007bb5;
      word-break: break-all;
      background: #f0f7fb;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .btn-copiar {
      display: inline-block;
      background: #4caf50;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-copiar:hover { background: #388e3c; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#10003;</div>
    <h1>Tu pedido ha sido recibido</h1>
    <p>Tu pago fue procesado exitosamente. Tu pedido ya esta en preparacion.</p>
    <div id="refBox" class="ref-box" style="display:none;">
      <p>Comparte este link con tus amigos y ellos recibiran 10% de descuento en su primer pedido:</p>
      <div id="refLink" class="ref-link"></div>
      <button class="btn-copiar" onclick="copiarLink()">Copiar link</button>
    </div>
    <a href="/cliente">Hacer otro pedido</a>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const ref = params.get("ref");
      if (ref) {
        const link = window.location.origin + "/cliente?ref=" + ref;
        document.getElementById("refLink").innerText = link;
        document.getElementById("refBox").style.display = "block";
      }
    })();
    function copiarLink() {
      const link = document.getElementById("refLink").innerText;
      navigator.clipboard.writeText(link).then(() => {
        const btn = document.querySelector(".btn-copiar");
        btn.innerText = "Copiado!";
        setTimeout(() => { btn.innerText = "Copiar link"; }, 2000);
      });
    }
  </script>
</body>
</html>
